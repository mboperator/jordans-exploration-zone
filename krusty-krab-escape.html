/* ------------------------------------------------------------- SKIN BADGE
   In first person you never get to see the character you paid for, so the
   skin sits in the corner where you can. Framed in its own rarity colour,
   because that is the thing you actually bought. */
function fitText(txt, x, y, fill, maxSize, maxW, align) {
  let s = maxSize;
  for (; s > 6; s--) {
    ctx.font = "600 " + s + "px 'Trebuchet MS',Verdana,sans-serif";
    if (ctx.measureText(txt).width <= maxW) break;
  }
  outText(txt, x, y, fill, s, align);
}
function drawSkinBadge() {
  const sk = skinById(SAVE.equipped);
  const w = 96, h = 112, x = W - w - 14, y = 50;
  const tc = TIERCOL[sk.tier] || "#9fb6c4";
  bevel(x, y, w, h);
  /* a rarity-coloured hairline, and a soft wash of it behind the portrait */
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, tc + "26"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; roundRect(x, y, w, h, 10); ctx.fill();
  ctx.strokeStyle = tc; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.5;
  roundRect(x, y, w, h, 10); ctx.stroke();
  ctx.restore();

  /* A little version of you, drawn rather than blitted, walking in step with
     the real one -- G.walkPhase only advances while you are actually moving,
     so the figure strides when you stride and settles when you stop. */
  const gy = y + h - 32;
  ctx.save();
  ctx.beginPath(); roundRect(x + 3, y + 3, w - 6, h - 32, 8); ctx.clip();
  ctx.globalAlpha = 0.30; ctx.fillStyle = "#0b1218";
  ctx.beginPath(); ctx.ellipse(x + w / 2 + 2, gy - 1, 21, 4.5, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
  const idle = 1 + Math.sin(G.time * 1.6) * 0.014;              // he breathes when idle
  /* fitted to the body's own height, so Gary and a fish person both fill it */
  const fit = 64 / toonHeight(sk.id);
  toonFigure(x + w / 2 - 3, gy, fit * (G.moving ? 1 : idle), G.walkPhase, sk,
             { mode: "walk", gait: G.moving ? (G.sprint ? 1.5 : 1.05) : 0 });
  ctx.restore();

  fitText(sk.name.toUpperCase(), x + w / 2, y + h - 24, "#eef2f6", 11, w - 10, "center");
  fitText(TIERS[sk.tier], x + w / 2, y + h - 9, tc, 9, w - 10, "center");
}

/* The objective, stated once at the top of a run. The game never actually told
   you what you were trying to do -- three toasts set the scene and none of them
   named the goal. Drawn over the post pass so the vignette can't mute it.
   It waits out INTRO_HOLD if you stand still, and clears the moment you move --
   see the dismissal in update(). */
const INTRO_HOLD = 10;                    // how long it hangs there if you don't move
const INTRO_OUT = 0.7;                    // the fade-out tail, and where a step clamps it
function drawIntro() {
  if (G.introT <= 0) return;
  const t = INTRO_HOLD - G.introT;
  const a = Math.min(1, t / 0.22) * Math.min(1, G.introT / INTRO_OUT);  // snap in, ease out
  const rise = (1 - Math.min(1, t / 0.35)) * 16;
  ctx.save();
  ctx.globalAlpha = a;
  const band = ctx.createLinearGradient(0, HH - 76, 0, HH + 52);
  band.addColorStop(0, "rgba(4,8,14,0)");
  band.addColorStop(0.30, "rgba(4,8,14,0.86)");
  band.addColorStop(0.70, "rgba(4,8,14,0.86)");

/* ------------------------------------------------------------------ HOTBAR */
function drawHotbar() {
  const slots = [];
  for (let i = 0; i < 4; i++) {
    const k = KEYDEF[i];
    slots.push({ label: "" + (i + 1), can: ITEM_CAN[k.id], have: !!G.keys[k.id], used: !!G.used[k.id], held: G.held === k.id });
  }
  slots.push({ label: "5", can: ITEM_CAN.white, have: !!G.keys.white, used: !!G.used.white, held: G.held === "white" });
  slots.push({ label: "6", can: ITEM_CAN.hammer, have: G.hasHammer, held: G.tool === "hammer" });
  slots.push({ label: "7", can: ITEM_CAN.plank, have: G.hasPlank, used: !!G.plankAt, held: G.tool === "plank" });
  slots.push({ label: "8", can: ITEM_CAN.gun, have: G.hasGun, held: G.tool === "gun" });

  const n = slots.length, sw = 50, gap = 4;
  const total = n * sw + (n - 1) * gap;
  let x = HW - total / 2;
  const y = H - 62;
  bevel(x - 8, y - 8, total + 16, sw + 16);
  for (const s of slots) {
    slot(x, y, sw, s.held);
    const on = s.have && !s.used;
    ctx.globalAlpha = on ? 1 : 0.30;
    blit(s.can, x + 7, y + 7, (sw - 14) / TS);
    ctx.globalAlpha = 1;
    if (s.used) {
      ctx.strokeStyle = "#e2504a"; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x + 10, y + 10); ctx.lineTo(x + sw - 10, y + sw - 10);
      ctx.moveTo(x + sw - 10, y + 10); ctx.lineTo(x + 10, y + sw - 10);
      ctx.stroke();
    }
    if (s.label) outText(s.label, x + 5, y + 15, "#e8e8e8", 12);
    x += sw + gap;
  }
  /* bubble bottles, as a row of chunky pips */
  const bx = HW - total / 2, by = y - 22;
  for (let i = 0; i < TUNING.maxAmmo; i++) {
    const px = bx + i * 18 + 7, py = by - 5;
    ctx.beginPath(); ctx.arc(px, py, 7, 0, 6.2832);
    ctx.fillStyle = "rgba(10,16,24,0.8)"; ctx.fill();
    if (i < G.ammo) {
      const gg = ctx.createRadialGradient(px - 2, py - 3, 1, px, py, 7);
      gg.addColorStop(0, "#eafaff"); gg.addColorStop(1, "#5fb4d6");
      ctx.beginPath(); ctx.arc(px, py, 5.5, 0, 6.2832); ctx.fillStyle = gg; ctx.fill();
    }
  }
  outText(G.ammo + "/" + TUNING.maxAmmo, bx + TUNING.maxAmmo * 18 + 8, by, "#e8e8e8", 14);
}
function drawStamina() {

/* ====================================================== SCENE PAINTING BITS
   The menus and the cutscene are built from the same block textures and mob
   sprites as the world, blown up with smoothing off. Hard pixels, flat
   colour, no curves anywhere. */
function tileBG(can, dark) {
  ctx.imageSmoothingEnabled = true;
  const s = 128;
  for (let y = 0; y < H; y += s) for (let x = 0; x < W; x += s) ctx.drawImage(can, x, y, s, s);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "rgba(2,8,14," + Math.min(1, dark + 0.12) + ")");
  g.addColorStop(0.5, "rgba(2,8,14," + dark + ")");
  g.addColorStop(1, "rgba(1,4,8," + Math.min(1, dark + 0.18) + ")");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function blitBig(can, cx, cy, s, flip) {
  ctx.imageSmoothingEnabled = true;
  const d = TS * s;
  ctx.save(); ctx.translate(cx, cy);
  if (flip) ctx.scale(1, -1);
  ctx.drawImage(can, -d / 2, -d / 2, d, d);
  ctx.restore();
}
/* the cast, rendered in 3D once and reused by the menus and the cut-scene */
/* one copy per colour channel, so the scare can be split apart */
const CHAN = {};
function channelCanvas(src, keep) {
  const k = "ch" + keep + src.width + (src.__id || (src.__id = Math.random().toString(36).slice(2)));
  if (CHAN[k]) return CHAN[k];
  const c = document.createElement("canvas"); c.width = src.width; c.height = src.height;
  const x = c.getContext("2d"); x.drawImage(src, 0, 0);
  const id = x.getImageData(0, 0, c.width, c.height), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (keep !== 0) d[i] = 0;
    if (keep !== 1) d[i + 1] = 0;
    if (keep !== 2) d[i + 2] = 0;
  }
  x.putImageData(id, 0, 0);
  CHAN[k] = c; return c;
}
const sbTitleCan  = () => modelCanvas("sbCrazy",  spongeM(0, 0, true, true), -0.30, 320, 250, 300, 1.42);
const sbScareCan  = () => modelCanvas("sbScare",  spongeM(0, 0, true, true), 0.0, 512, 1000, 886, 1.12);
const patCan      = () => modelCanvas("patStand", patrickM(0, false),    0.45, 256, 200, 226, 1.20);
const patWaveCan  = () => modelCanvas("patWave",  patrickM(0, true),    -0.40, 256, 200, 226);
function mcButton(x, y, w, h, label, sel, sub) {

  if (sel) { g.addColorStop(0, "rgba(112,158,86,0.95)"); g.addColorStop(1, "rgba(50,80,38,0.95)"); }
  else { g.addColorStop(0, "rgba(58,72,88,0.88)"); g.addColorStop(1, "rgba(22,32,44,0.92)"); }
  ctx.fillStyle = g; roundRect(x, y, w, h, 9); ctx.fill();

}
/* a hanging chain, links catching the light */
function blockChain(x, yTop, yBot, w) {
  for (let y = yTop; y < yBot; y += w * 1.55) {
    const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    g.addColorStop(0, "#5e646c"); g.addColorStop(0.35, "#c8ced8"); g.addColorStop(1, "#4a5058");
    ctx.strokeStyle = g; ctx.lineWidth = w * 0.34;
    ctx.beginPath(); ctx.ellipse(x, y + w * 0.7, w * 0.42, w * 0.72, 0, 0, 6.2832); ctx.stroke();
  }
}

/* ------------------------------------------------------------ TITLE SCREEN */
/* ==================================================== SHOW-STYLE SPONGEBOB
   The cover is a painted card, not the game world, so he is drawn here in
   the cartoon's own language: fat ink lines, flat cel fills, wobbly edges
   that never sit perfectly straight, and pores that quietly breathe. */
const PORES = [];
(function buildPores() {
  srand(4127);
  for (let i = 0; i < 44; i++) PORES.push({
    x: -0.40 + rnd() * 0.80, y: -0.42 + rnd() * 0.84,
    r: 0.028 + rnd() * 0.052, sq: 0.72 + rnd() * 0.55,
    ph: rnd() * 6.283, sp: 0.6 + rnd() * 1.6, br: rnd() < 0.30
  });
})();
const INK_LINE = "#221a10";

function spongePath(cx, cy, hw, hh, t) {
  ctx.beginPath();
  const N = 132, n = 6.4;
  for (let i = 0; i <= N; i++) {
    const th = (i / N) * 6.28318;
    const c = Math.cos(th), sn = Math.sin(th);
    const px = Math.sign(c) * Math.pow(Math.abs(c), 2 / n);
    const py = Math.sign(sn) * Math.pow(Math.abs(sn), 2 / n);
    const wob = 1 + Math.sin(th * 7 + t * 0.7) * 0.012 + Math.sin(th * 13 - t * 0.45) * 0.008;
    const X = cx + px * hw * wob, Y = cy + py * hh * wob;
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
}
function inkFill(fill, lw) {
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = INK_LINE; ctx.lineWidth = lw === undefined ? 5 : lw;
  ctx.lineJoin = "round"; ctx.stroke();
}
/* Body space: 1.0 is the edge of the sponge, so anything past 1.0 -- shirt,
   trousers, legs, arms, spatula -- hangs outside him and stays visible. */
function drawSpongeShow(cx, cy, s, evil, t) {
  const u = s / 2;
  const P = (a, b) => [cx + a * u, cy + b * u];
  const YEL = evil ? "#e8ca3c" : "#f8e152", YDK = evil ? "#967c16" : "#c7a51e";
  ctx.save(); ctx.lineJoin = "round"; ctx.lineCap = "round";

  /* --- legs, shoes, trousers, shirt: all below the body --- */
  for (const sd of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(...P(sd * 0.30, 1.40)); ctx.lineTo(...P(sd * 0.36, 1.66));
    ctx.strokeStyle = INK_LINE; ctx.lineWidth = s * 0.062 + 7; ctx.stroke();
    ctx.strokeStyle = YEL; ctx.lineWidth = s * 0.062; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(...P(sd * 0.40, 1.71), s * 0.085, s * 0.048, 0, 0, 6.2832);
    inkFill("#2b2721", 5);
  }
  ctx.beginPath(); ctx.rect(...P(-0.88, 1.20), s * 0.88, s * 0.17); inkFill("#a97a3e", 6);
  ctx.beginPath(); ctx.rect(...P(-0.88, 1.44), s * 0.88, s * 0.05); inkFill("#7d5527", 4);
  ctx.beginPath(); ctx.rect(...P(-0.92, 0.94), s * 0.92, s * 0.26); inkFill("#fdfdfa", 6);
  ctx.beginPath();                                        // the collar points
  ctx.moveTo(...P(-0.30, 0.94)); ctx.lineTo(...P(-0.04, 0.94)); ctx.lineTo(...P(-0.17, 1.16));
  ctx.closePath(); inkFill("#f0f0ea", 4);
  ctx.beginPath();
  ctx.moveTo(...P(0.30, 0.94)); ctx.lineTo(...P(0.04, 0.94)); ctx.lineTo(...P(0.17, 1.16));
  ctx.closePath(); inkFill("#f0f0ea", 4);

  /* --- arms, reaching out past the body --- */
  /* The spatula hand sits lower than a full salute: raised any higher and the
     blade climbs behind the title plate and loses its glint. The other arm is
     kept short -- at full reach it ran straight through Patrick. */
  const handL = P(-1.08, 0.80), handR = P(1.50, -0.02);
  for (const [from, to] of [[P(-0.90, 0.16), handL], [P(0.90, 0.04), handR]]) {
    ctx.beginPath(); ctx.moveTo(from[0], from[1]); ctx.lineTo(to[0], to[1]);
    ctx.strokeStyle = INK_LINE; ctx.lineWidth = s * 0.052 + 8; ctx.stroke();
    ctx.strokeStyle = YEL; ctx.lineWidth = s * 0.052; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(to[0], to[1], s * 0.055, s * 0.055, 0, 0, 6.2832);
    inkFill(YEL, 5);
  }

  /* --- the sponge --- */
  const breath = 1 + Math.sin(t * 1.5) * 0.009;
  const uw = u * breath, uh = u / breath;
  spongePath(cx, cy, uw, uh, t);
  inkFill(YEL, 8);
  ctx.save(); spongePath(cx, cy, uw, uh, t); ctx.clip();
  /* pores: each drifts, breathes and squashes on its own clock */
  for (const p of PORES) {
    const br = Math.sin(t * p.sp + p.ph);
    const rr = p.r * 2.1 * (1 + br * (p.br ? 0.30 : 0.13));
    const px = cx + (p.x * 1.9 + Math.sin(t * p.sp * 0.6 + p.ph) * 0.022) * u;
    const py = cy + (p.y * 1.9 + Math.cos(t * p.sp * 0.5 + p.ph) * 0.022) * u;
    ctx.beginPath(); ctx.ellipse(px, py, rr * u, rr * u * p.sq, p.ph, 0, 6.2832);
    ctx.fillStyle = YDK; ctx.fill();
    ctx.strokeStyle = evil ? "rgba(96,74,10,0.55)" : "rgba(150,120,20,0.45)";
    ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(px - rr * u * 0.15, py - rr * u * 0.20, rr * u * 0.60, rr * u * p.sq * 0.56, p.ph, 0, 6.2832);
    ctx.fillStyle = evil ? "#c2a327" : "#eed557"; ctx.fill();
  }
  const sg = ctx.createLinearGradient(cx - u, cy, cx + u, cy);
  sg.addColorStop(0, "rgba(120,80,0,0.20)"); sg.addColorStop(0.55, "rgba(0,0,0,0)");
  ctx.fillStyle = sg; ctx.fillRect(cx - u, cy - u, s, s);
  if (evil) {
    const ug = ctx.createLinearGradient(0, cy + u, 0, cy - u);
    ug.addColorStop(0, "rgba(255,180,70,0.34)"); ug.addColorStop(0.45, "rgba(0,0,0,0)");
    ug.addColorStop(1, "rgba(12,22,54,0.50)");
    ctx.fillStyle = ug; ctx.fillRect(cx - u, cy - u, s, s);
  }
  ctx.restore();
  spongePath(cx, cy, uw, uh, t);                     // re-ink on top of everything
  ctx.strokeStyle = INK_LINE; ctx.lineWidth = 8; ctx.stroke();

  /* --- tie --- */
  ctx.beginPath();
  ctx.moveTo(...P(-0.13, 1.12)); ctx.lineTo(...P(0.13, 1.12));
  ctx.lineTo(...P(0.18, 1.46)); ctx.lineTo(...P(0, 1.58)); ctx.lineTo(...P(-0.18, 1.46));
  ctx.closePath(); inkFill("#cf2b25", 5);

  /* --- eyes --- */
  const tw = evil ? Math.sin(t * 43) * s * 0.010 : 0;
  const eyes = evil
    ? [{ x: -0.300, y: -0.20, r: 0.370, ir: 0.108, pu: 0.038 },
       { x: 0.300, y: -0.19, r: 0.262, ir: 0.124, pu: 0.060, lid: 0.44, blood: 1 }]
    : [{ x: -0.272, y: -0.19, r: 0.288, ir: 0.150, pu: 0.070 },
       { x: 0.272, y: -0.19, r: 0.288, ir: 0.150, pu: 0.070 }];
  /* a slow, irregular blink -- the cheapest way to make a face feel alive */
  const bc = (t * 0.42) % 1;
  const blink = !evil && bc > 0.965 ? Math.sin((bc - 0.965) / 0.035 * Math.PI) : 0;
  for (const e of eyes) {
    const ex = cx + e.x * u + (e.blood ? tw : 0), ey = cy + e.y * u + (e.blood ? tw * 0.6 : 0);
    const R0 = e.r * u;
    ctx.beginPath(); ctx.ellipse(ex, ey, R0, R0, 0, 0, 6.2832);
    inkFill(e.blood ? "#fbe9e9" : "#fbfbf8", 6);
    if (e.blood) {
      ctx.save(); ctx.beginPath(); ctx.ellipse(ex, ey, R0, R0, 0, 0, 6.2832); ctx.clip();
      srand(77); ctx.strokeStyle = "rgba(198,40,38,0.9)"; ctx.lineWidth = 2.6;
      for (let i = 0; i < 10; i++) {
        const ang = rnd() * 6.283;
        ctx.beginPath();
        ctx.moveTo(ex + Math.cos(ang) * R0, ey + Math.sin(ang) * R0);
        ctx.quadraticCurveTo(ex + Math.cos(ang) * R0 * 0.5 + (rnd() - 0.5) * 16,
                             ey + Math.sin(ang) * R0 * 0.5 + (rnd() - 0.5) * 16,
                             ex + Math.cos(ang) * R0 * 0.16, ey + Math.sin(ang) * R0 * 0.16);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.beginPath(); ctx.ellipse(ex, ey, e.ir * u, e.ir * u, 0, 0, 6.2832); inkFill("#3f8fd6", 4);
    ctx.beginPath(); ctx.ellipse(ex, ey, e.pu * u, e.pu * u, 0, 0, 6.2832);
    ctx.fillStyle = "#141018"; ctx.fill();
    ctx.beginPath();
    ctx.ellipse(ex - e.pu * u * 0.72, ey - e.pu * u * 0.82, e.pu * u * 0.42, e.pu * u * 0.42, 0, 0, 6.2832);
    ctx.fillStyle = "#fff"; ctx.fill();
    if (e.lid) {
      ctx.save(); ctx.beginPath(); ctx.ellipse(ex, ey, R0 + 3, R0 + 3, 0, 0, 6.2832); ctx.clip();
      ctx.beginPath(); ctx.rect(ex - R0 - 5, ey - R0 - 5, R0 * 2 + 10, R0 * (1 + e.lid));
      inkFill(YEL, 6); ctx.restore();
    }
    if (blink > 0.02) {                                   // the lid comes down
      ctx.save(); ctx.beginPath(); ctx.ellipse(ex, ey, R0 + 3, R0 + 3, 0, 0, 6.2832); ctx.clip();
      ctx.beginPath(); ctx.rect(ex - R0 - 5, ey - R0 - 5, R0 * 2 + 10, (R0 * 2 + 10) * blink);
      inkFill(YEL, 6); ctx.restore();
    }
    for (let k = -1; k <= 1; k++) {
      const ang = -1.95 + k * 0.44;
      ctx.beginPath();
      ctx.moveTo(ex + Math.cos(ang) * R0, ey + Math.sin(ang) * R0);
      ctx.lineTo(ex + Math.cos(ang) * R0 * 1.34, ey + Math.sin(ang) * R0 * 1.34);
      ctx.strokeStyle = INK_LINE; ctx.lineWidth = 5.5; ctx.stroke();
    }
  }
  /* --- nose --- */
  ctx.beginPath(); ctx.ellipse(...P(0, 0.12), s * 0.032, s * 0.062, 0, 0, 6.2832); inkFill(YEL, 5);

  /* --- mouth --- */
  if (evil) {
    ctx.beginPath();
    ctx.moveTo(...P(-0.94, 0.22));
    ctx.quadraticCurveTo(...P(0, 0.06), ...P(0.94, 0.22));
    ctx.quadraticCurveTo(...P(0, 0.94), ...P(-0.94, 0.22));
    inkFill("#6d1622", 6);
    for (let i = -4; i <= 4; i++) {
      const fx = i * 0.196, fy = 0.22 + Math.abs(i) * 0.030;
      ctx.beginPath(); ctx.rect(...P(fx - 0.086, fy), s * 0.172, s * 0.20); inkFill("#fbfbf4", 3.5);
      ctx.beginPath(); ctx.rect(...P(fx - 0.086, fy + 0.40), s * 0.172, s * 0.16); inkFill("#eee9de", 3.5);
    }
  } else {
    ctx.beginPath();
    ctx.moveTo(...P(-0.52, 0.28));
    ctx.quadraticCurveTo(...P(0, 0.70), ...P(0.52, 0.28));
    ctx.strokeStyle = INK_LINE; ctx.lineWidth = 7; ctx.stroke();
    for (const sd of [-1, 1]) {
      ctx.beginPath();
      ctx.rect(...P(sd > 0 ? 0.010 : -0.170, 0.455), s * 0.080, s * 0.105);
      inkFill("#fbfbf4", 4.5);
    }
    for (const sd of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(...P(sd * 0.66, 0.30), s * 0.075, s * 0.048, 0, 0, 6.2832);
      ctx.fillStyle = "rgba(240,140,140,0.42)"; ctx.fill();
    }
  }

  /* --- the spatula, in the raised hand --- */
  ctx.save();
  ctx.translate(handR[0], handR[1]); ctx.rotate(-0.30);
  ctx.beginPath(); ctx.rect(-s * 0.032, -s * 0.34, s * 0.064, s * 0.34); inkFill("#8f5f2c", 5);
  ctx.beginPath(); ctx.rect(-s * 0.150, -s * 0.56, s * 0.300, s * 0.22); inkFill("#c3c9d3", 6);
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fillRect(-s * 0.118, -s * 0.532, s * 0.22, s * 0.030);
  const gl = ((t * 0.42) % 1);                            // a highlight sweeps the blade
  if (gl < 0.34) {
    const gx = -s * 0.150 + gl / 0.34 * s * 0.300;
    const gg = ctx.createLinearGradient(gx - s * 0.05, 0, gx + s * 0.05, 0);
    gg.addColorStop(0, "rgba(255,255,255,0)");
    gg.addColorStop(0.5, "rgba(255,255,255,0.85)");
    gg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = gg; ctx.fillRect(-s * 0.150, -s * 0.56, s * 0.300, s * 0.22);
  }
  ctx.strokeStyle = "#8f96a2"; ctx.lineWidth = 4.5;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(i * s * 0.078, -s * 0.522); ctx.lineTo(i * s * 0.078, -s * 0.378); ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

/* Patrick, drawn the same way: a proper five-point star with the show's soft
   lumpy limbs, and the face he wears when something has gone very wrong. */
/* There is not a sharp edge anywhere on Patrick -- every point of him is a
   blunt dome. A star built from single vertices comes to five spikes, so each
   tip is sampled as a short ARC instead and the whole outline is drawn as a
   quadratic through the midpoints. The curve then rolls over the top of each
   point rather than turning a corner, and the valleys between them come out
   soft and shallow, which is the shape he actually is. */
const TIP_ARC = 0.26;            // half-width of each domed tip, in radians
const STAR_TIP = 0.99;           // how far out the drawn tip lands, as a fraction of R
function starPath(cx, cy, R, r, t) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const wob = 1 + Math.sin(a * 3 + t * 0.9) * 0.020;
    if (i & 1) {
      pts.push([cx + Math.cos(a) * r * wob, cy + Math.sin(a) * r * wob]);
    } else {
      for (const d of [-TIP_ARC, 0, TIP_ARC])
        pts.push([cx + Math.cos(a + d) * R * wob, cy + Math.sin(a + d) * R * wob]);
    }
  }
  const n = pts.length;
  ctx.beginPath();
  ctx.moveTo((pts[0][0] + pts[n - 1][0]) / 2, (pts[0][1] + pts[n - 1][1]) / 2);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.closePath();
}
function drawPatrickShow(cx, cy, s, t) {
  const u = s / 2;
  const P = (a, b) => [cx + a * u, cy + b * u];
  ctx.save(); ctx.lineJoin = "round"; ctx.lineCap = "round";
  starPath(cx, cy, u, u * 0.32, t);
  inkFill("#f195a8", 8);
  ctx.save(); starPath(cx, cy, u, u * 0.32, t); ctx.clip();
  srand(23);
  for (let i = 0; i < 46; i++) {
    const px = cx + (rnd() * 2 - 1) * u * 0.85, py = cy + (rnd() * 2 - 1) * u * 0.85;
    ctx.beginPath(); ctx.ellipse(px, py, 3.2, 2.4, rnd() * 3, 0, 6.2832);
    ctx.fillStyle = "rgba(206,110,134,0.55)"; ctx.fill();
  }
  const g = ctx.createLinearGradient(cx - u, cy - u, cx + u, cy + u);
  g.addColorStop(0, "rgba(255,255,255,0.20)"); g.addColorStop(0.5, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(120,40,60,0.26)");
  ctx.fillStyle = g; ctx.fillRect(cx - u, cy - u, s, s);
  /* Flowered shorts across his middle, cut with two leg holes and a
     waistband. Hung upside down a plain green band reads as a hat; the
     notch between the legs is what tells you which way up he is. */
  ctx.beginPath();
  ctx.moveTo(...P(-0.46, 0.16)); ctx.lineTo(...P(0.46, 0.16));
  ctx.lineTo(...P(0.46, 0.40)); ctx.lineTo(...P(0.15, 0.40));
  ctx.lineTo(...P(0, 0.26)); ctx.lineTo(...P(-0.15, 0.40));
  ctx.lineTo(...P(-0.46, 0.40)); ctx.closePath();
  inkFill("#4fae6b", 5);
  ctx.beginPath(); ctx.rect(...P(-0.46, 0.16), s * 0.46, s * 0.055); inkFill("#3a8a57", 3.5);
  /* a crease running up out of the notch into each leg. Hung upside down the
     two upper star points are the only thing saying "legs", and without this
     they merge with the shorts into one green-banded lump. */
  ctx.strokeStyle = "rgba(176,86,110,0.75)"; ctx.lineWidth = 4;
  for (const sd of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(...P(sd * 0.06, 0.44));
    ctx.quadraticCurveTo(...P(sd * 0.30, 0.60), ...P(sd * 0.46, 0.74));
    ctx.stroke();
  }
  /* kept above the notch apex, or the middle one falls straight through it */
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.ellipse(...P(i * 0.30, 0.245), s * 0.036, s * 0.036, 0, 0, 6.2832);
    inkFill("#9a60b6", 3);
    ctx.beginPath(); ctx.ellipse(...P(i * 0.30, 0.245), s * 0.015, s * 0.015, 0, 0, 6.2832);
    ctx.fillStyle = "#f0dc78"; ctx.fill();
  }
  ctx.restore();
  /* wide, frightened eyes -- big whites, tiny pupils, brows up */
  const jit = Math.sin(t * 9) * s * 0.004;
  for (const sd of [-1, 1]) {
    const [ex, ey] = P(sd * 0.24, -0.20);
    const R0 = s * 0.150;
    ctx.beginPath(); ctx.ellipse(ex + jit * sd, ey, R0, R0 * 1.10, 0, 0, 6.2832);
    inkFill("#fbfbf8", 5.5);
    ctx.beginPath();
    ctx.ellipse(ex + jit * sd + sd * R0 * 0.10, ey + R0 * 0.18, R0 * 0.22, R0 * 0.22, 0, 0, 6.2832);
    ctx.fillStyle = "#161219"; ctx.fill();
    ctx.beginPath();
    ctx.ellipse(ex + jit * sd - R0 * 0.16, ey - R0 * 0.02, R0 * 0.11, R0 * 0.11, 0, 0, 6.2832);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.beginPath();                                          // worried brow
    ctx.moveTo(ex - R0 * 1.05, ey - R0 * 1.30 + sd * R0 * 0.16);
    ctx.quadraticCurveTo(ex, ey - R0 * 1.62, ex + R0 * 1.05, ey - R0 * 1.30 - sd * R0 * 0.16);
    ctx.strokeStyle = INK_LINE; ctx.lineWidth = 7; ctx.stroke();
  }
  /* a small, uncertain, open mouth */
  ctx.beginPath();
  ctx.ellipse(...P(0, 0.02), s * 0.070, s * 0.055 + Math.sin(t * 2.2) * s * 0.008, 0, 0, 6.2832);
  inkFill("#7d2436", 5);
  ctx.beginPath(); ctx.ellipse(...P(0, 0.055), s * 0.040, s * 0.026, 0, 0, 6.2832);
  ctx.fillStyle = "#d4707f"; ctx.fill();
  ctx.restore();
}

/* ================================================ THE CAST, DRAWN NOT BUILT
   The world is rendered from boxes because a raycaster needs characters that
   turn as you walk round them. A cut-scene has no such constraint, and boxes
   read as boxes -- so the cut-scene cast and the corner badge are DRAWN, in
   the show's own idiom: a fat black contour, flat cel fill, rounded tapering
   limbs. Same skins, same walk cycle, no voxels.

   Body space: the figure stands on y = 0, up is negative, and the context is
   scaled so 1 unit is about hip height. Line widths are quoted in those same
   units, so the ink weight tracks the figure's size for free. */
const TOON_INK = 0.048;
/* The far side of the body. Kept close to the near side on purpose: push it
   much darker and the legs and shoes merge into one unreadable mass. */
const cD = (c, k) => c2css(shade(c, k === undefined ? 0.82 : k));

/* One limb: the same two-segment polyline stroked twice -- fat in black, then
   thinner in the limb colour. That is exactly how the show inks a limb, and it
   costs two strokes. Returns the tip and its angle so a hand or a shoe can be
   planted on the end of it. Angle 0 points straight down; positive swings
   forward, which is screen-right. */
function toonLimb(x0, y0, a1, l1, a2, l2, w, colr) {
  const kx = x0 + Math.sin(a1) * l1, ky = y0 + Math.cos(a1) * l1;
  const b = a1 + a2;
  const fx = kx + Math.sin(b) * l2, fy = ky + Math.cos(b) * l2;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy);
  ctx.strokeStyle = INK_LINE; ctx.lineWidth = w + TOON_INK; ctx.stroke();
  ctx.strokeStyle = colr; ctx.lineWidth = w; ctx.stroke();
  return [fx, fy, b];
}
function toonShoe(x, y, ang, w, h, colr) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang * 0.40);
  ctx.beginPath(); ctx.ellipse(w * 0.22, 0, w, h, 0, 0, 6.2832);
  inkFill(colr, TOON_INK);
  ctx.restore();
}
/* the show's eyes: big whites that touch, a coloured ring, a black pupil and a
   single catchlight. Nearly everything a face says, it says through these. */
function toonEyes(cx, cy, r, gap, iris, o) {
  o = o || {};
  const look = o.look === undefined ? 0.16 : o.look;
  const ir = o.ir || 0.46, pu = o.pu || 0.22;
  for (const sd of [-1, 1]) {
    const ex = cx + sd * gap;
    ctx.beginPath(); ctx.ellipse(ex, cy, r, r * (o.tall || 1.08), 0, 0, 6.2832);
    inkFill("#fbfbf8", TOON_INK * 0.85);
    const px = ex + look * r, py = cy + (o.down || 0) * r;
    ctx.beginPath(); ctx.ellipse(px, py, r * ir, r * ir, 0, 0, 6.2832);
    ctx.fillStyle = iris; ctx.fill();
    ctx.beginPath(); ctx.ellipse(px, py, r * pu, r * pu, 0, 0, 6.2832);
    ctx.fillStyle = "#141018"; ctx.fill();
    ctx.beginPath(); ctx.ellipse(px - r * 0.17, py - r * 0.20, r * 0.11, r * 0.11, 0, 0, 6.2832);
    ctx.fillStyle = "#fff"; ctx.fill();
    if (o.brow) {
      ctx.beginPath();
      ctx.moveTo(ex - r * 0.95, cy - r * 1.18 - sd * r * 0.12 * o.brow);
      ctx.quadraticCurveTo(ex, cy - r * 1.48, ex + r * 0.95, cy - r * 1.18 + sd * r * 0.12 * o.brow);
      ctx.strokeStyle = INK_LINE; ctx.lineWidth = TOON_INK * 1.2; ctx.stroke();
    }
  }
}
/* a mouth. `open` drives a gasp, otherwise the skin's own resting shape. */
function toonMouth(cx, cy, w, kind, open) {
  if (open > 0.02) {
    ctx.beginPath();
    ctx.ellipse(cx, cy + w * 0.12, w * 0.50, w * (0.26 + open * 0.40), 0, 0, 6.2832);
    inkFill("#6f1c2c", TOON_INK * 0.9);
    ctx.beginPath();
    ctx.ellipse(cx, cy + w * 0.30, w * 0.28, w * 0.15, 0, 0, 6.2832);
    ctx.fillStyle = "#c8586a"; ctx.fill();
    return;
  }
  ctx.strokeStyle = INK_LINE; ctx.lineWidth = TOON_INK * 1.15; ctx.lineCap = "round";
  ctx.beginPath();
  if (kind === "o") { ctx.ellipse(cx, cy + w * 0.10, w * 0.24, w * 0.22, 0, 0, 6.2832); ctx.stroke(); }
  else { ctx.moveTo(cx - w * 0.44, cy); ctx.quadraticCurveTo(cx, cy + w * 0.54, cx + w * 0.44, cy); ctx.stroke(); }
}

/* The pose every body shares. `winded` braces the legs and folds the torso
   right over -- which works here, unlike in the box renderer, because a drawn
   silhouette has no top face to swallow the limbs underneath it. */
function toonPose(phase, gait, mode) {
  const bob = gait ? (0.016 + Math.cos(phase * 2) * 0.016) * gait : 0;
  const wind = mode === "winded";
  return {
    hipY: -0.46 - bob,
    lean: mode === "run" ? 0.15 : wind ? 0.70 + Math.sin(phase) * 0.06 : 0.03,
    wind: wind,
    breath: wind ? Math.sin(phase) : 0,
    /* the box rig's swing is far too wide once it is a flat silhouette: at
       full amplitude the figure reads as sprawling rather than striding, so
       the 2D cast takes about two-thirds of it */
    leg: sd => wind ? { hip: 0.20 + sd * 0.16, knee: 0.34 }
                    : (g => ({ hip: g.hip * 0.62, knee: g.knee * 0.72 }))(gaitPose(phase, sd, gait)),
    arm: sd => wind ? { arm: 0.30 * sd } : { arm: gaitPose(phase, sd, gait).arm * 0.62 },
    gasp: mode === "run" ? 0.34 : wind ? 0.62 + Math.max(0, Math.sin(phase)) * 0.38 : 0
  };
}

/* The generic body: a Bikini Bottom fish person. The show really does treat
   Fred, Harold, Nat, Tom, Scooter and Jenkins as one design in different
   paint, so they legitimately share this -- the characters that DON'T get
   their own builder below. */
function toonFish(s, S, phase, gait, mode, o) {
  const P = toonPose(phase, gait, mode);
  const bc = c2css(S.bc);
  const sh = S.shirt || shade(S.bc, 0.72);
  const pt = S.pants || shade(S.bc, 0.52);
  const am = S.arm || sh;
  const shirt = c2css(sh), pants = c2css(pt), armC = c2css(am);
  const hand = c2css(S.hand || S.bc);
  const iris = c2css(S.iris || col(70, 150, 210));
  const shoe = "#39323c";

  /* far leg and arm first and knocked back a shade, so the figure reads as
     having two sides without any depth buffer to help */
  for (const sd of [-1, 1]) {
    const g = P.leg(sd), near = sd > 0;
    const [fx, fy, ang] = toonLimb(sd * 0.058, P.hipY, g.hip, 0.245, -g.knee, 0.225,
                                   0.130, near ? pants : cD(pt));
    toonShoe(fx, fy, ang, 0.105, 0.062, near ? shoe : "#4a4450");
  }
  /* everything above the waist tips forward about the hip */
  ctx.save(); ctx.translate(0, P.hipY); ctx.rotate(P.lean);
  const shY = -0.34 - (P.wind ? 0 : 0), chest = 0.30 + P.breath * 0.018;
  /* the far arm goes behind the torso */
  {
    const g = P.arm(-1);
    const [hx, hy] = toonLimb(-0.15, -0.28, (g.arm || 0) * 1.3 + (P.wind ? 0.30 : 0), 0.175,
                              P.wind ? 0.10 : -0.55, 0.155, 0.096, cD(am));
    ctx.beginPath(); ctx.ellipse(hx, hy, 0.060, 0.060, 0, 0, 6.2832); inkFill(cD(S.hand || S.bc), TOON_INK * 0.8);
  }
  /* torso */
  ctx.beginPath();
  ctx.moveTo(-0.175, 0.03);
  ctx.quadraticCurveTo(-0.215, -0.16, -0.170, -shY - chest * 0.02);
  ctx.quadraticCurveTo(0, -0.44 - chest * 0.03, 0.170, -shY - chest * 0.02);
  ctx.quadraticCurveTo(0.215, -0.16, 0.175, 0.03);
  ctx.closePath(); inkFill(shirt, TOON_INK);
  /* a belt and the waistband of the trousers */
  ctx.beginPath(); ctx.moveTo(-0.178, 0.006); ctx.lineTo(0.178, 0.006);
  ctx.strokeStyle = INK_LINE; ctx.lineWidth = TOON_INK * 0.8; ctx.stroke();
  if (S.tie) {
    ctx.beginPath();
    ctx.moveTo(-0.040, -0.30); ctx.lineTo(0.040, -0.30);
    ctx.lineTo(0.052, -0.09); ctx.lineTo(0, -0.02); ctx.lineTo(-0.052, -0.09);
    ctx.closePath(); inkFill(c2css(S.tie), TOON_INK * 0.7);
  }
  /* head: a rounded fish skull with a snout and a head fin */
  const hy = -0.53;
  ctx.beginPath();
  ctx.moveTo(-0.02, hy - 0.19);                                  // the fin
  ctx.quadraticCurveTo(0.09, hy - 0.34, 0.18, hy - 0.25);
  ctx.quadraticCurveTo(0.11, hy - 0.21, 0.09, hy - 0.16);
  ctx.closePath(); inkFill(cD(S.bc, 0.86), TOON_INK * 0.8);
  ctx.beginPath(); ctx.ellipse(0, hy, 0.180, 0.188, 0, 0, 6.2832); inkFill(bc, TOON_INK);
  ctx.beginPath();                                               // snout and lips
  ctx.ellipse(0.042, hy + 0.098, 0.112, 0.072, -0.10, 0, 6.2832);
  inkFill(cD(S.bc, 1.06), TOON_INK * 0.75);
  ctx.beginPath();                                               // gills
  ctx.moveTo(-0.122, hy + 0.02); ctx.quadraticCurveTo(-0.148, hy + 0.07, -0.118, hy + 0.115);
  ctx.strokeStyle = INK_LINE; ctx.lineWidth = TOON_INK * 0.7; ctx.stroke();
  toonEyes(0.010, hy - 0.048, 0.074, 0.072, iris, { brow: S.brow ? (S.angry ? -1 : 1) : 0, down: P.wind ? 0.2 : 0 });
  toonMouth(0.048, hy + 0.106, 0.122, S.mouth, P.gasp);
  if (S.hat === "sailor") {                                      // the fry cook's hat
    ctx.beginPath();
    ctx.moveTo(-0.180, hy - 0.150); ctx.lineTo(0.180, hy - 0.150);
    ctx.lineTo(0.155, hy - 0.212); ctx.quadraticCurveTo(0, hy - 0.335, -0.155, hy - 0.212);
    ctx.closePath(); inkFill("#f4f6fa", TOON_INK);
  }
  /* the near arm, over the top of everything */
  {
    const g = P.arm(1);
    const [hx, hy2] = toonLimb(0.15, -0.28, (g.arm || 0) * 1.3 + (P.wind ? 0.30 : 0), 0.175,
                               P.wind ? 0.10 : -0.55, 0.155, 0.102, armC);
    ctx.beginPath(); ctx.ellipse(hx, hy2, 0.064, 0.064, 0, 0, 6.2832); inkFill(hand, TOON_INK * 0.8);
  }
  ctx.restore();
}

/* --- the ones a tinted fish cannot fake ------------------------------------
   Squidward's nose, Gary's shell, Karen's monitor and Krabs' claws ARE those
   characters. Painting the generic body a different colour would make the
   corner badge useless, which is the one thing it exists to do. */

function toonLegsPlain(P, colr, dark, shoe, len) {
  const l = len || 0.255;
  for (const sd of [-1, 1]) {
    const g = P.leg(sd), near = sd > 0;
    const [fx, fy, ang] = toonLimb(sd * 0.055, P.hipY, g.hip, l, -g.knee, l * 0.92,
                                   0.105, near ? colr : dark);
    toonShoe(fx, fy, ang, 0.118, 0.066, near ? shoe : "#2b262e");
  }
}

function toonSponge(s, S, phase, gait, mode) {
  const P = toonPose(phase, gait, mode);
  toonLegsPlain(P, "#c08a3e", "#8d6329", "#2b2721");
  ctx.save(); ctx.translate(0, P.hipY); ctx.rotate(P.lean);
  for (const sd of [-1, 1]) {
    const g = P.arm(sd);
    const [hx, hy] = toonLimb(sd * 0.20, -0.30, (g.arm || 0) * 1.6, 0.20, -0.30, 0.17,
                              0.070, sd > 0 ? "#f8e152" : "#c7a51e");
    ctx.beginPath(); ctx.ellipse(hx, hy, 0.055, 0.055, 0, 0, 6.2832);
    inkFill(sd > 0 ? "#f8e152" : "#c7a51e", TOON_INK * 0.8);
  }
  ctx.beginPath(); ctx.rect(-0.20, -0.11, 0.40, 0.15); inkFill("#a97a3e", TOON_INK * 0.8);
  ctx.beginPath(); ctx.rect(-0.21, -0.24, 0.42, 0.14); inkFill("#fdfdfa", TOON_INK * 0.8);
  /* the sponge: square, but never mechanically square */
  ctx.beginPath();
  ctx.moveTo(-0.235, -0.22);
  ctx.quadraticCurveTo(-0.265, -0.50, -0.215, -0.74);
  ctx.quadraticCurveTo(0, -0.80, 0.215, -0.74);
  ctx.quadraticCurveTo(0.265, -0.50, 0.235, -0.22);
  ctx.closePath(); inkFill("#f8e152", TOON_INK);
  ctx.save(); ctx.clip();
  srand(11);
  for (let i = 0; i < 9; i++) {

    ctx.beginPath(); ctx.ellipse(px, py, r, r * 0.82, 0, 0, 6.2832);

function toonPatrick(s, S, phase, gait, mode) {
  const P = toonPose(phase, gait, mode);
  const PK = "#f195a8", PKd = "#c46a80";
  /* He is nearly all body, so his hip rides low and his legs are stumps --
     that ratio is most of what makes a drawing read as Patrick. */
  const hipY = -0.30 - (gait ? Math.abs(Math.cos(phase)) * 0.02 * gait : 0);
  for (const sd of [-1, 1]) {
    const g = P.leg(sd), near = sd > 0;
    const [fx, fy, ang] = toonLimb(sd * 0.085, hipY, g.hip * 0.9, 0.165, -g.knee * 0.7, 0.150,
                                   0.140, near ? PK : PKd);
    toonShoe(fx, fy, ang, 0.098, 0.058, near ? PK : PKd);
  }
  ctx.save(); ctx.translate(0, hipY); ctx.rotate(P.lean * 0.8);
  /* the body: the top three points of the star, blunt as ever */
  ctx.beginPath();
  ctx.moveTo(-0.20, 0.10);
  ctx.quadraticCurveTo(-0.42, -0.10, -0.40, -0.24);        // left arm point
  ctx.quadraticCurveTo(-0.30, -0.30, -0.17, -0.34);
  ctx.quadraticCurveTo(-0.10, -0.60, 0, -0.72);            // head point
  ctx.quadraticCurveTo(0.10, -0.60, 0.17, -0.34);
  ctx.quadraticCurveTo(0.30, -0.30, 0.40, -0.24);          // right arm point
  ctx.quadraticCurveTo(0.42, -0.10, 0.20, 0.10);
  ctx.closePath(); inkFill(PK, TOON_INK);
  ctx.save(); ctx.clip();
  ctx.beginPath(); ctx.rect(-0.24, -0.06, 0.48, 0.19); inkFill("#4fae6b", TOON_INK * 0.7);
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.ellipse(i * 0.13, 0.035, 0.032, 0.032, 0, 0, 6.2832);
    inkFill("#9a60b6", TOON_INK * 0.5);

  for (let i = 0; i < 16; i++) {
    ctx.beginPath();

    ctx.fillStyle = "rgba(206,110,134,0.5)"; ctx.fill();

  ctx.restore();
  toonEyes(0, -0.44, 0.085, 0.082, "#2b2320", { ir: 0.30, pu: 0.30, brow: 1 });
  toonMouth(0, -0.30, 0.15, "smile", Math.max(P.gasp, 0.12));

function toonSquid(s, S, phase, gait, mode, o, posh) {
  const P = toonPose(phase, gait, mode);
  const bc = c2css(S.bc), bcd = cD(S.bc);

  /* four tentacles instead of legs -- two swing, two trail */
  for (const sd of [-1, 1]) {
    const g = P.leg(sd), near = sd > 0;
    for (const k of [0, 1]) {
      const [fx, fy] = toonLimb(sd * (0.05 + k * 0.055), P.hipY, g.hip * (1 - k * 0.4) + sd * k * 0.18,
                                0.25, -g.knee * 0.7, 0.23, 0.088 - k * 0.018, near && !k ? bc : bcd);
      if (!k) { ctx.beginPath(); ctx.ellipse(fx + 0.02, fy + 0.012, 0.075, 0.038, 0, 0, 6.2832); inkFill(near ? bc : bcd, TOON_INK * 0.7); }
    }

  ctx.save(); ctx.translate(0, P.hipY); ctx.rotate(P.lean);
  for (const sd of [-1, 1]) {
    const g = P.arm(sd);
    toonLimb(sd * 0.13, -0.28, (g.arm || 0) * 1.4, 0.185, -0.35, 0.165, 0.078, sd > 0 ? bc : bcd);
  }
  ctx.beginPath();                                            // the shirt
  ctx.moveTo(-0.155, 0.02); ctx.quadraticCurveTo(-0.185, -0.16, -0.150, -0.30);
  ctx.lineTo(0.150, -0.30); ctx.quadraticCurveTo(0.185, -0.16, 0.155, 0.02);
  ctx.closePath(); inkFill(shirt, TOON_INK);
  /* the bulb head, and the nose that IS the character */
  ctx.beginPath(); ctx.ellipse(0, -0.56, 0.155, 0.235, 0, 0, 6.2832); inkFill(bc, TOON_INK);
  ctx.beginPath();
  ctx.moveTo(0.06, -0.60); ctx.quadraticCurveTo(0.20, -0.58, 0.255, -0.47);
  ctx.quadraticCurveTo(0.30, -0.36, 0.245, -0.30);

  ctx.quadraticCurveTo(0.11, -0.53, 0.05, -0.53);
  ctx.closePath(); inkFill(bc, TOON_INK);
  toonEyes(-0.005, -0.66, 0.078, 0.072, "#c8b48a",
           { ir: 0.34, pu: 0.20, tall: 0.80, brow: -1, look: 0.05 });
  /* the heavy lids he is never without */
  ctx.beginPath();
  ctx.ellipse(-0.005, -0.71, 0.155, 0.052, 0, 0, Math.PI);
  ctx.fillStyle = bcd; ctx.fill();
  toonMouth(0.03, -0.42, 0.12, "flat", P.gasp);

    ctx.beginPath();

    ctx.strokeStyle = INK_LINE; ctx.lineWidth = TOON_INK * 2.2; ctx.stroke();

}

function toonGary(s, S, phase, gait, mode) {

/* Plankton, matched to the model the game already uses so he stays the same
   character. `grin` 0..1 widens and drops the mouth and grows the teeth in. */
function toonPlankton(s, S, phase, gait, mode, o) {
  const grin = (o && o.grin) || 0;
  const P = toonPose(phase, gait, mode);
  const G1 = "#5cb24a", Gd = "#3c8230";
  const lerp = (a, b) => a + (b - a) * grin;
  const tw = grin > 0.35 ? Math.sin(phase * 9) * 0.02 * (grin - 0.35) : 0;
  /* four little legs */
  for (const sd of [-1, 1]) {
    const g = P.leg(sd);
    for (const k of [0, 1]) {
      toonLimb(sd * (0.055 + k * 0.05), P.hipY + 0.30, g.hip * 0.8 + sd * k * 0.2, 0.10,
               -g.knee * 0.6, 0.09, 0.036, k || sd < 0 ? Gd : G1);
    }
  }
  ctx.save(); ctx.translate(0, P.hipY + 0.30); ctx.rotate(P.lean * 0.5);
  for (const sd of [-1, 1]) {                                  // arms
    const g = P.arm(sd);
    toonLimb(sd * 0.085, -0.10, (g.arm || 0) * 1.4 + sd * 0.5 - grin * 0.5 * sd, 0.105, -0.25, 0.095,
             0.036, sd > 0 ? G1 : Gd);
  }
  /* A shade bigger than it was. The eye used to poke out of the top of his own
     head and the grin ran wider than his face -- both of which read as one dark
     smear rather than a face, because everything spilling past the outline
     landed on the arms and the background. */
  ctx.beginPath(); ctx.ellipse(0, -0.205, 0.155, 0.205, 0, 0, 6.2832); inkFill(G1, TOON_INK * 0.7);
  for (const sd of [-1, 1]) {                                  // antennae
    ctx.beginPath();
    ctx.moveTo(sd * 0.055, -0.34);
    ctx.quadraticCurveTo(sd * 0.10, -0.46, sd * 0.13 + sd * tw, -0.53);
    ctx.strokeStyle = INK_LINE; ctx.lineWidth = 0.055; ctx.stroke();
    ctx.strokeStyle = Gd; ctx.lineWidth = 0.030; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(sd * 0.13 + sd * tw, -0.545, 0.036, 0.036, 0, 0, 6.2832);
    inkFill(Gd, TOON_INK * 0.6);
  }
  /* the one eye -- and it is the whole face */
  /* Sized and sat so a band of green survives all the way round it. When the eye
     ran to the edge of the head the two ink contours met and the whole face read
     as one dark mass with a green crescent stuck to the bottom. */
  const EY = -0.250, er = lerp(0.086, 0.102);
  ctx.beginPath(); ctx.ellipse(0, EY, er, er, 0, 0, 6.2832); inkFill("#fbfbf8", TOON_INK * 0.6);
  ctx.beginPath(); ctx.ellipse(0, EY, er * lerp(0.46, 0.38), er * lerp(0.46, 0.38), 0, 0, 6.2832);
  ctx.fillStyle = "#c62c2c"; ctx.fill();
  const pr = er * lerp(0.21, 0.115);        // a pinprick in all that white
  ctx.beginPath(); ctx.ellipse(0, EY, pr, pr, 0, 0, 6.2832);
  ctx.fillStyle = "#141018"; ctx.fill();
  ctx.beginPath(); ctx.ellipse(-er * 0.30, EY - er * 0.30, er * 0.16, er * 0.16, 0, 0, 6.2832);
  ctx.fillStyle = "#fff"; ctx.fill();
  /* A heavy lid slants in from the left as he leers. Clipped to the eye so it
     reads as a lid rather than a wedge parked on his face. */
  if (grin > 0.05) {
    /* fully closed in by 0.65 -- the beat sweeps grin 0..1 over two seconds and
       a linear ramp spends most of it doing nothing you can see */
    const lid = Math.min(1, (grin - 0.05) / 0.60);
    const l0 = EY - er * (1 - lid * 0.62), l1 = EY - er * (1 - lid * 0.14);
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, EY, er, er, 0, 0, 6.2832); ctx.clip();
    ctx.beginPath();
    ctx.moveTo(-er * 1.3, l0); ctx.lineTo(er * 1.3, l1);
    ctx.lineTo(er * 1.3, EY - er * 1.6); ctx.lineTo(-er * 1.3, EY - er * 1.6);
    ctx.closePath(); ctx.fillStyle = Gd; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-er * 1.3, l0); ctx.lineTo(er * 1.3, l1);
    ctx.strokeStyle = INK_LINE; ctx.lineWidth = TOON_INK * 0.9; ctx.stroke();
    ctx.restore();
  }
  /* The single brow. An arch raised in the middle reads quizzical, so as the
     grin comes on it drives down on the inner end and cuts across the eye at an
     angle -- the diagonal is what makes a face look like it means it. */
  ctx.beginPath();
  ctx.moveTo(-0.092, lerp(-0.360, -0.326));
  ctx.quadraticCurveTo(-0.005, lerp(-0.378, -0.360), 0.078, lerp(-0.358, -0.382));
  ctx.strokeStyle = INK_LINE; ctx.lineWidth = TOON_INK * (1.0 + grin * 0.5); ctx.stroke();
  /* The grin, stretching the whole way. Not an ellipse -- an ellipse is a
     surprised "O" however wide you pull it. The corners hook up past the lip
     line, the bottom lip bows deep, and the teeth come to points. */
  /* Sized to the band between the eye's ink contour and the chin, and kept
     inside the head's own outline at that height -- the previous grin ran wider
     than his face, so at full stretch it bled onto the arms and vanished. */
  const mw = lerp(0.050, 0.095);        // never wider than the head is at this height
  const mh = lerp(0.013, 0.042);        // how far the bottom lip bows below the line
  const dip = lerp(0.004, 0.017);       // how far the top lip dips at the centre
  const my = lerp(-0.094, -0.078), curl = grin * 0.032;
  /* A quadratic passes through the midpoint of its control polygon, not through
     the control point -- the same trap the star tips fell into. Aiming a curve
     straight at the lip drew about a fifth of the opening it asked for, and the
     ink line then closed what was left, which is why there was no mouth at all
     above half a grin. Solve for the control that puts the curve where it is
     actually wanted. */
  const ctlT = my - 2 * dip + curl, ctlB = my + 2 * mh + curl;
  const mouthPath = () => {
    ctx.beginPath();
    ctx.moveTo(-mw, my - curl);
    ctx.quadraticCurveTo(0, ctlT, mw, my - curl);
    ctx.quadraticCurveTo(0, ctlB, -mw, my - curl);
    ctx.closePath();
  };
  mouthPath(); ctx.fillStyle = "#4d0e1d"; ctx.fill();
  if (grin > 0.08) {
    /* Five fangs down, four up, interlocking. Few and fat rather than a fine
       sawtooth -- at sprite size a fine one greys into a flat band and stops
       reading as teeth. Clipped to the lips, so they emerge from the gum line. */
    const th = Math.min(1, (grin - 0.08) / 0.55), tw = mw * 0.36;
    const up = (dip + mh) * 1.05 * th, dn = (dip + mh) * 0.62 * th;
    ctx.save(); mouthPath(); ctx.clip();
    ctx.fillStyle = "#fdfdf8"; ctx.beginPath();
    for (let i = -2; i <= 2; i++) {                            // upper row, pointing down
      const x = i * tw;
      ctx.moveTo(x - tw * 0.5, my - curl); ctx.lineTo(x + tw * 0.5, my - curl);
      ctx.lineTo(x, my - curl + up);
    }
    for (let i = -2; i <= 1; i++) {                            // lower row, pointing up
      const x = i * tw + tw * 0.5;
      ctx.moveTo(x - tw * 0.48, my + mh); ctx.lineTo(x + tw * 0.48, my + mh);
      ctx.lineTo(x, my + mh - dn);
    }
    ctx.fill();
    ctx.strokeStyle = "rgba(112,84,90,0.5)"; ctx.lineWidth = TOON_INK * 0.20;
    ctx.stroke();                                              // just enough to separate them
    ctx.restore();
  }
  mouthPath();
  ctx.strokeStyle = INK_LINE; ctx.lineWidth = TOON_INK * 0.55; ctx.stroke();
  ctx.restore();
}

/* How tall each body actually stands, in body units. A snail, a monitor on a
   stand and a fish person are wildly different heights, so anything framing a
   figure in a fixed box normalises on this instead of leaving half of them
   marooned in dead space. */
const TOON_H = {
  spongebob: 1.22, patrick: 1.06, squidward: 1.28, squilliam: 1.28,
  gary: 0.74, karen: 0.94, krabs: 0.88, sandy: 0.94, plankton: 0.75
};
const toonHeight = id => TOON_H[id] || 1.34;

/* Same dispatch idea as CAST, but for the drawn cast. Anything not named here
   is a townsfolk fish, which is exactly right for them. */
const TOON_CAST = {
  spongebob: toonSponge, patrick: toonPatrick, plankton: toonPlankton,
  squidward: toonSquid,
  squilliam: (s, S, p, g, m, o) => toonSquid(s, S, p, g, m, o, true),
  gary: toonGary, karen: toonKaren, krabs: toonKrabs, sandy: toonSandy
};

/* Draw a skin as a figure standing on (gx, gy). `s` is pixels per body unit,
   so the whole figure comes out roughly 1.35*s tall. */
function toonFigure(gx, gy, s, phase, S, o) {
  o = o || {};
  const mode = o.mode || "run";
  const gait = o.gait !== undefined ? o.gait : (mode === "run" ? 1.7 : mode === "walk" ? 1.05 : 0);
  const b = TOON_CAST[S.id] || toonFish;
  ctx.save();
  ctx.translate(gx, gy);
  ctx.scale(o.flip ? -s : s, s);
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  b(s, S, phase, gait, mode, o);
  ctx.restore();
}

/* the failing fluorescent over the dining room. He is only ever wrong inside
   a flash -- never in steady light, so you are never quite sure you saw it. */
const flick = { level: 1, evil: false, next: 1.6, burst: 0, hold: 0, last: 0 };
function updateFlicker(t) {
  let dt = t - flick.last; flick.last = t;
  if (dt < 0 || dt > 0.25) dt = 0.016;
  if (flick.burst > 0) {
    flick.burst -= dt;
    const k = Math.sin(t * 47) + Math.sin(t * 83 + 1.3) + Math.sin(t * 31 + 2.1);
    flick.level = k > 0.5 ? 1 : k > -0.7 ? 0.16 : 0.03;
    flick.evil = flick.level > 0.9 && (((t * 37) | 0) & 1) === 0;
    if (flick.hold > 0) { flick.hold -= dt; flick.level = 1; flick.evil = true; }
    if (flick.burst <= 0) { flick.level = 1; flick.evil = false; flick.hold = 0; }
  } else {
    flick.level += (1 - flick.level) * Math.min(1, dt * 9);
    flick.evil = false;
    flick.next -= dt;
    if (flick.next <= 0) {
      flick.burst = 0.30 + Math.random() * 0.45;
      flick.next = flick.burst + 2.4 + Math.random() * 4.2;
      if (Math.random() < 0.55) flick.hold = 0.09 + Math.random() * 0.08;
      noise(0.18, 0.05, 0, 2600, 3);
      blip(118, 0.22, "sawtooth", 0.035);
      setTimeout(() => noise(0.09, 0.04, 0, 1800, 4), 90);
    }
  }
}

/* dust hanging in the lamplight */
const MOTES = [];
for (let i = 0; i < 70; i++)
  MOTES.push({ x: Math.random() * 800, y: Math.random() * 500,
    r: 0.6 + Math.random() * 1.8, vx: (Math.random() - 0.5) * 5, vy: -3 - Math.random() * 9,
    p: Math.random() * 6.28 });

let TITLE_PAT = null;
function titlePattern() {
  if (!TITLE_PAT) TITLE_PAT = ctx.createPattern(CAN_PLANKS, "repeat");
  return TITLE_PAT;
}
/* fill a polygon with the plank material, then tint it by facing */
function surface(pts, tint, scale) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.clip();
  ctx.fillStyle = titlePattern();
  ctx.save(); ctx.scale(scale, scale);
  ctx.fillRect(0, 0, W / scale, H / scale);
  ctx.restore();
  ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawTitle() {
  const t = G.time;
  updateFlicker(t);
  const LV = flick.level;
  /* ---------- a room in one-point perspective ---------- */
  ctx.fillStyle = "#05080c"; ctx.fillRect(0, 0, W, H);
  const bx0 = 214, bx1 = 586, by0 = 128, by1 = 372;          // the back wall
  surface([[0, 0], [W, 0], [bx1, by0], [bx0, by0]], "rgba(3,7,12,0.80)", 1.5);      // ceiling
  surface([[0, H], [bx0, by1], [bx1, by1], [W, H]], "rgba(4,8,12,0.62)", 1.2);      // floor
  surface([[0, 0], [bx0, by0], [bx0, by1], [0, H]], "rgba(3,6,10,0.74)", 1.0);      // left wall
  surface([[W, 0], [bx1, by0], [bx1, by1], [W, H]], "rgba(3,6,10,0.78)", 1.0);      // right wall
  surface([[bx0, by0], [bx1, by0], [bx1, by1], [bx0, by1]], "rgba(6,10,16,0.66)", 0.9);
  /* floorboards running to the vanishing point */
  ctx.save(); ctx.beginPath();
  ctx.moveTo(0, H); ctx.lineTo(bx0, by1); ctx.lineTo(bx1, by1); ctx.lineTo(W, H); ctx.closePath(); ctx.clip();
  ctx.strokeStyle = "rgba(0,0,0,0.55)"; ctx.lineWidth = 2;
  for (let i = -6; i <= 6; i++) {
    ctx.beginPath(); ctx.moveTo(HW + i * 150, H + 40); ctx.lineTo(HW + i * 26, by1); ctx.stroke();
  }
  ctx.restore();
  /* skirting where the walls meet the floor */
  ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(bx0, by1); ctx.lineTo(bx1, by1); ctx.lineTo(W, H); ctx.stroke();

  /* the EXIT sign, glowing away at the back -- the thing you are heading for */
  ctx.save();
  ctx.shadowColor = "rgba(90,255,140,0.9)"; ctx.shadowBlur = 26;
  ctx.fillStyle = "#0b1a10"; ctx.fillRect(352, 296, 96, 30);
  ctx.fillStyle = "#7dff9c";
  ctx.font = "bold 20px 'Trebuchet MS',Verdana,sans-serif";
  ctx.textAlign = "center"; ctx.fillText("EXIT", 400, 319);
  ctx.restore();

  /* ---------- the swinging lamp, and the cone it throws ---------- */
  const lampA = Math.sin(t * 1.05) * 0.30 + Math.sin(t * 2.1) * 0.04;
  const ax = 400, ay = 96, rope = 78;
  const lx = ax + Math.sin(lampA) * rope, ly = ay + Math.cos(lampA) * rope;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  ctx.save(); ctx.translate(lx, ly); ctx.rotate(lampA);
  const cone = ctx.createLinearGradient(0, 0, 0, 420);
  cone.addColorStop(0, "rgba(255,224,150," + (0.32 * LV).toFixed(3) + ")");
  cone.addColorStop(0.55, "rgba(255,206,110," + (0.10 * LV).toFixed(3) + ")");
  cone.addColorStop(1, "rgba(255,196,90,0)");
  ctx.fillStyle = cone;
  ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(16, 0);
  ctx.lineTo(240, 420); ctx.lineTo(-240, 420); ctx.closePath(); ctx.fill();
  ctx.restore();
  const glow = ctx.createRadialGradient(lx, ly + 14, 2, lx, ly + 14, 150);
  glow.addColorStop(0, "rgba(255,232,168," + (0.70 * LV).toFixed(3) + ")"); glow.addColorStop(1, "rgba(255,200,90,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  ctx.strokeStyle = "#1d1610"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(lx, ly); ctx.stroke();
  const shade = ctx.createLinearGradient(lx - 26, ly, lx + 26, ly + 26);
  shade.addColorStop(0, "#c98a3c"); shade.addColorStop(1, "#4e3113");
  ctx.fillStyle = shade;
  ctx.beginPath(); ctx.moveTo(lx - 28, ly + 26); ctx.lineTo(lx + 28, ly + 26);
  ctx.lineTo(lx + 15, ly); ctx.lineTo(lx - 15, ly); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,238,180," + (0.25 + 0.70 * LV).toFixed(3) + ")";
  ctx.beginPath(); ctx.ellipse(lx, ly + 28, 11, 6, 0, 0, 6.2832); ctx.fill();

  /* ---------- Patrick, hung head-down on the LEFT, swinging properly ----------
     He rotates about the ceiling anchor rather than sliding sideways, and his
     body trails the chain by a few hundredths of a second so he reads heavy. */
  const pax = 118, pay = 66, prope = 118, pS = 206, pu = pS / 2;
  const swA = 0.34;
  const pAng = Math.sin(t * 1.35) * swA + Math.sin(t * 2.7 + 0.6) * swA * 0.10;
  const pLag = Math.sin(t * 1.35 - 0.30) * swA + Math.sin(t * 2.7 + 0.3) * swA * 0.10;
  /* Land an ankle in the shackle. The star's outer points sit at -90, -18, 54,
     126 and 198 degrees; flipping him head-down turns the 126 one into a
     raised leg. But `starPath` draws a quadratic *through the midpoints* using
     those vertices only as control points, so a tip actually lands about 84%
     of the way out -- aim at the vertex and the chain hangs in clear water
     beside him, which is why you couldn't tell he was chained up at all.
     `STAR_TIP` is where the drawn tip really falls, as a fraction of R. */
  const LEGA = 126 * Math.PI / 180, LR = pu * STAR_TIP;
  const TX = -Math.cos(LEGA) * LR, TY = prope + 2 + Math.sin(LEGA) * LR;
  const cA = Math.cos(pLag), sA = Math.sin(pLag);
  const pbx = pax + TX * cA - TY * sA, pby = pay + TX * sA + TY * cA;

  /* a practical of his own: without it the room and the vignette between them
     leave him a dim smudge, and he is meant to be the thing you notice second */
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const pg = ctx.createRadialGradient(pbx, pby, 12, pbx, pby, 215);
  pg.addColorStop(0, "rgba(255,188,146," + (0.30 * LV).toFixed(3) + ")");
  pg.addColorStop(1, "rgba(255,150,110,0)");
  ctx.fillStyle = pg; ctx.fillRect(0, 0, W, H);
  ctx.restore();

  /* his shadow, thrown across the left wall -- kept light, or it muddies the
     silhouette it is meant to be separating from the wall */
  ctx.save();
  ctx.globalAlpha = 0.30; ctx.filter = "brightness(0) blur(7px)";
  ctx.translate(pax - 66, pay + 16); ctx.rotate(pLag * 0.72);
  ctx.translate(TX, TY); ctx.scale(0.92, -1.06);
  drawPatrickShow(0, 0, pS, t);
  ctx.restore(); ctx.filter = "none"; ctx.globalAlpha = 1;
  /* the chain */
  ctx.save(); ctx.translate(pax, pay); ctx.rotate(pAng);
  blockChain(0, 0, prope, 13);
  const shk = ctx.createLinearGradient(-13, 0, 13, 0);
  shk.addColorStop(0, "#8a6d24"); shk.addColorStop(0.4, "#e6c25e"); shk.addColorStop(1, "#6d5418");
  ctx.fillStyle = shk; ctx.fillRect(-14, prope - 6, 28, 19);
  ctx.strokeStyle = "#2a2110"; ctx.lineWidth = 3;
  ctx.strokeRect(-14, prope - 6, 28, 19);
  ctx.restore();
  /* the body */
  ctx.save(); ctx.globalAlpha = 0.70 + 0.30 * LV;
  ctx.filter = "saturate(1.14) brightness(" + (0.94 + 0.26 * LV).toFixed(3) + ")";
  ctx.translate(pax, pay); ctx.rotate(pLag);
  ctx.translate(TX, TY); ctx.scale(1, -1);
  drawPatrickShow(0, 0, pS, t);
  ctx.restore(); ctx.filter = "none"; ctx.globalAlpha = 1;

  /* ---------- SpongeBob, drawn the way the show draws him ----------
     Cheerful by default. The tube stutters, and for two or three frames you
     get the other one -- never in steady light, so you are never sure. */
  /* He is lifted and trimmed from where he started so the white collar and
     the red tie clear the difficulty buttons. The shirt and tie are the most
     recognisable thing about him after the eyes, and they were buried. */
  const sx = 424, sy = 200, sSize = 232;

  ctx.save();                                             // key light goes FIRST,
  ctx.globalCompositeOperation = "lighter";               // so his ink line survives
  const upy = sy + sSize * 0.52;
  const up = ctx.createRadialGradient(sx - 10, upy, 8, sx - 10, upy, 290);
  up.addColorStop(0, "rgba(255,216,136," + (0.42 * LV).toFixed(3) + ")");
  up.addColorStop(1, "rgba(255,190,90,0)");
  ctx.fillStyle = up; ctx.fillRect(0, 0, W, H);
  ctx.restore();

  ctx.save();                                             // he sits in the room
  ctx.globalAlpha = 0.55; ctx.filter = "blur(10px)";
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(sx, sy + sSize * 0.784, sSize * 0.528, sSize * 0.080, 0, 0, 6.2832); ctx.fill();
  ctx.restore(); ctx.filter = "none"; ctx.globalAlpha = 1;

  ctx.save();
  ctx.filter = flick.evil
    ? "saturate(0.74) brightness(0.90) contrast(1.20)"
    : "brightness(" + (0.62 + 0.38 * LV).toFixed(3) + ")";
  drawSpongeShow(sx, sy, sSize, flick.evil, t);
  ctx.restore(); ctx.filter = "none";

  if (flick.evil) {                                       // a red edge, for a frame
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const rr = ctx.createRadialGradient(sx, sy, sSize * 0.34, sx, sy, sSize * 1.05);
    rr.addColorStop(0, "rgba(0,0,0,0)"); rr.addColorStop(1, "rgba(190,20,16,0.34)");
    ctx.fillStyle = rr; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  /* ---------- dust in the light ---------- */
  for (const m of MOTES) {
    m.x += m.vx * 0.016 + Math.sin(t * 0.6 + m.p) * 0.35;
    m.y += m.vy * 0.016;
    if (m.y < -6) { m.y = H + 6; m.x = Math.random() * W; }
    const d = Math.hypot(m.x - lx, m.y - ly - 120) / 300;
    const a = Math.max(0, 0.5 - d) * 0.9;
    if (a <= 0.01) continue;
    ctx.fillStyle = "rgba(255,238,200," + a.toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.2832); ctx.fill();
  }

  /* ---------- grade: vignette and a whisper of grain ---------- */
  /* eased off the corners: at the old weight it took nearly half the light
     back off Patrick, who lives out on the left */
  const vg = ctx.createRadialGradient(HW, HH, H * 0.26, HW, HH, H * 0.86);
  vg.addColorStop(0, "rgba(0,0,0," + (0.30 * (1 - LV)).toFixed(3) + ")");
  vg.addColorStop(1, "rgba(0,0,0," + (0.68 + 0.22 * (1 - LV)).toFixed(3) + ")");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  /* ---------- title and menu ---------- */
  const tg = ctx.createLinearGradient(0, 0, 0, 120);
  tg.addColorStop(0, "rgba(2,6,12,0.92)"); tg.addColorStop(1, "rgba(2,6,12,0)");
  ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 120);
  ctx.save();
  ctx.shadowColor = "rgba(255,170,40,0.75)"; ctx.shadowBlur = 26;
  outText("KRUSTY KRAB", HW, 62, "#ffd24a", 50, "center");
  ctx.shadowColor = "rgba(255,90,30,0.7)";
  outText("ESCAPE", HW, 100, "#ff7a4a", 34, "center");
  ctx.restore();
  outText("He locked the doors at closing. He is still whistling.", HW, 124, "#b9c6d2", 13, "center");

  /* the band starts lower and bites harder than it used to, so his tie has
     somewhere to hang without the menu washing over it */
  const bg = ctx.createLinearGradient(0, H - 126, 0, H);
  bg.addColorStop(0, "rgba(2,6,12,0)"); bg.addColorStop(0.20, "rgba(2,6,12,0.66)");
  bg.addColorStop(0.42, "rgba(2,6,12,0.94)"); bg.addColorStop(1, "rgba(2,6,12,0.98)");
  ctx.fillStyle = bg; ctx.fillRect(0, H - 126, W, 126);
  const bw = 200, bxm = HW - (bw * 3 + 16) / 2, by = H - 108;
  for (let i = 0; i < 3; i++) mcButton(bxm + i * (bw + 8), by, bw, 38, DIFFS[i].name, i === diffIdx);
  outText(DIFFS[diffIdx].blurb, HW, by + 60, "#c8c8d0", 13, "center");
  const on = ((t * 2) | 0) & 1;
  outText("PRESS SPACE TO GO IN", HW, by + 86, on ? "#ffd24a" : "#c8a83a", 21, "center");
  outText("< >  difficulty     B  shop     M  mute", HW, by + 106, "#9a9aa2", 12, "center");

  outText("KRUSTY BUCKS  " + SAVE.bucks, 18, 34, "#ffd24a", 18);
  outText("escapes " + SAVE.escapes + (SAVE.best ? "   best " + SAVE.best.toFixed(1) + "s" : ""), 18, 56, "#a8a8b0", 13);
  if (!storageOK) outText("progress won't be saved in this browser", W - 16, 34, "#8a8a92", 12, "right");
}

/* ------------------------------------------------------------------- SHOP */
let shopSel = 0, shopScroll = 0;
const SHOP_COLS = 6, SHOP_ROWS = 3, CARD_W = 118, CARD_H = 108, CARD_GAP = 8;
function shopMove(dx, dy) {
  let i = shopSel + dx + dy * SHOP_COLS;
  if (i < 0) i = 0; if (i >= SKINS.length) i = SKINS.length - 1;
  shopSel = i;
  const row = (shopSel / SHOP_COLS) | 0;
  if (row < shopScroll) shopScroll = row;
  if (row >= shopScroll + SHOP_ROWS) shopScroll = row - SHOP_ROWS + 1;
  blip(560, 0.04, "sine", 0.08);
}
function shopAct() {
  const s = SKINS[shopSel];
  if (SAVE.owned.includes(s.id)) {
    if (SAVE.equipped === s.id) { blip(300, 0.06, "sine", 0.08); return; }
    SAVE.equipped = s.id; writeSave();
    toast("Wearing " + s.name + ".", 2.4);
    blip(700, 0.07, "sine", 0.14); blip(980, 0.09, "sine", 0.11);
    return;
  }
  if (SAVE.bucks < s.price) {
    blip(100, 0.2, "square", 0.14);
    toast("Not enough Krusty Bucks. You need " + (s.price - SAVE.bucks) + " more.", 2.8);
    return;
  }
  SAVE.bucks -= s.price;
  SAVE.owned.push(s.id);
  SAVE.equipped = s.id;
  writeSave();
  kaching();
  toast("Bought " + s.name + "!", 3);
}
function drawShop() {
  tileBG(CAN_DIRT, 0.68);
  ctx.fillStyle = "rgba(6,12,20,0.88)"; ctx.fillRect(0, 0, W, 76);
  ctx.strokeStyle = "rgba(180,210,235,0.18)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, 76); ctx.lineTo(W, 76); ctx.stroke();
  outText("THE REGISTER", 20, 36, "#ffd24a", 24);
  outText("Escape once, earn 5 Krusty Bucks. Spend them here.", 20, 60, "#c8c8d0", 13);
  outText("KRUSTY BUCKS  " + SAVE.bucks, W - 20, 42, "#ffd24a", 24, "right");

  const gw = SHOP_COLS * CARD_W + (SHOP_COLS - 1) * CARD_GAP;
  const gx = (W - gw) / 2, gy = 88;
  for (let r = 0; r < SHOP_ROWS; r++) for (let c = 0; c < SHOP_COLS; c++) {
    const i = (r + shopScroll) * SHOP_COLS + c;
    if (i >= SKINS.length) continue;
    const s = SKINS[i];
    const x = gx + c * (CARD_W + CARD_GAP), y = gy + r * (CARD_H + CARD_GAP);
    const owned = SAVE.owned.includes(s.id), eq = SAVE.equipped === s.id, sel = i === shopSel;
    bevel(x, y, CARD_W, CARD_H, eq ? "rgba(48,74,42,0.94)" : null);
    if (sel) {
      ctx.save(); ctx.shadowColor = "rgba(255,200,90,0.8)"; ctx.shadowBlur = 16;
      ctx.strokeStyle = "#ffd24a"; ctx.lineWidth = 3;
      roundRect(x - 1, y - 1, CARD_W + 2, CARD_H + 2, 11); ctx.stroke(); ctx.restore();
    }
    ctx.fillStyle = TIERCOL[s.tier]; roundRect(x + 6, y + 4, CARD_W - 12, 3, 2); ctx.fill();
    /* you can always see exactly what you're buying */
    blit(portrait(s.id), x + (CARD_W - 68) / 2, y + 6, 68 / TS);
    let fs = 11;
    ctx.font = "bold 11px 'Trebuchet MS',Verdana,sans-serif";
    while (fs > 7 && ctx.measureText(s.name).width > CARD_W - 10) {
      fs--; ctx.font = "bold " + fs + "px 'Trebuchet MS',Verdana,sans-serif";
    }
    outText(s.name, x + CARD_W / 2, y + 86, owned ? "#f0f0f0" : "#c8c8d0", fs, "center");
    if (eq) outText("WEARING", x + CARD_W / 2, y + 101, "#c8f07a", 11, "center");
    else if (owned) outText("OWNED", x + CARD_W / 2, y + 101, "#8fc8e0", 11, "center");
    else outText(s.price + " KB", x + CARD_W / 2, y + 101, SAVE.bucks >= s.price ? "#ffd24a" : "#c07068", 12, "center");
  }
  const rows = Math.ceil(SKINS.length / SHOP_COLS);
  if (rows > SHOP_ROWS) {
    const track = SHOP_ROWS * (CARD_H + CARD_GAP) - CARD_GAP;
    const bh = track * (SHOP_ROWS / rows);
    const by = gy + (track - bh) * (shopScroll / Math.max(1, rows - SHOP_ROWS));
    ctx.fillStyle = "rgba(255,255,255,0.10)"; roundRect(W - 14, gy, 7, track, 4); ctx.fill();
    ctx.fillStyle = "rgba(255,210,74,0.75)"; roundRect(W - 14, by, 7, bh, 4); ctx.fill();
  }
  const s = SKINS[shopSel];
  const owned = SAVE.owned.includes(s.id);
  ctx.fillStyle = "rgba(8,10,16,0.94)"; ctx.fillRect(0, H - 66, W, 66);
  outText(s.name, 20, H - 38, "#ffffff", 20);

/* ----------------------------------------------------------------- CAUGHT */
function drawCaught() {
  const t = G.caughtT;
  const face = sbScareCan();
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

  /* the first breath of it: pure white, one frame, no easing in */
  if (t < 0.05) { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H); }

  if (t < 1.35) {
    /* it arrives already enormous and keeps pushing in */
    const push = 1.12 + Math.min(t, 1.35) * 0.34;
    const size = H * push;
    /* violent, high-frequency displacement that decays */
    const vio = Math.max(0, 1 - t / 0.9);
    const ox = (Math.random() * 2 - 1) * 34 * vio;
    const oy = (Math.random() * 2 - 1) * 30 * vio;
    /* split the channels apart -- the wrongness is the point */
    const split = 16 * vio + 3;
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.globalCompositeOperation = "lighter";
    const chans = [[2, -split], [1, 0], [0, split]];
    for (const [k, dx] of chans) {
      ctx.drawImage(channelCanvas(face, k),
        HW + ox + dx - size / 2, HH + oy - size / 2, size, size);
    }
    ctx.restore();
    /* strobe: alternate frames blow out red then white */
    const fl = ((t * 26) | 0) & 1;
    if (t < 0.55 && fl) {
      ctx.fillStyle = t < 0.25 ? "rgba(255,255,255,0.34)" : "rgba(190,20,16,0.34)";
      ctx.fillRect(0, 0, W, H);
    }
    /* scanline tear -- a band of the image jumps sideways */
    if (Math.random() < 0.5 * vio) {
      const ty = (Math.random() * H) | 0, th2 = 10 + ((Math.random() * 60) | 0);
      const sh = (Math.random() * 2 - 1) * 60 * vio;
      const band = ctx.getImageData(0, ty, W, Math.min(th2, H - ty));
      ctx.putImageData(band, sh, ty);
    }
    /* the room closing in, hard red */
    const vg = ctx.createRadialGradient(HW, HH, H * 0.05, HW, HH, H * 0.72);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(90,0,0," + (0.55 + vio * 0.4).toFixed(3) + ")");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  /* then it is simply over */
  if (t > 1.2) {
    ctx.fillStyle = "rgba(0,0,0," + Math.min(1, (t - 1.2) * 2.4) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (t > 1.7) {
    ctx.save();
    ctx.shadowColor = "rgba(200,0,0,0.9)"; ctx.shadowBlur = 30;
    outText("HE GOT YOU", HW, HH - 34, "#ff4a3a", 46, "center");
    ctx.restore();
    if (G.patrick.active) outText("Patrick too. You went together.", HW, HH + 4, "#ffb0c0", 17, "center");
    else outText("Nobody heard a thing.", HW, HH + 4, "#c8c8d0", 16, "center");
    outText("survived " + G.playTime.toFixed(1) + "s   \u00b7   " + DIFFS[diffIdx].name, HW, HH + 34, "#a8a8b0", 14, "center");
    if (t > 2.3) {
      const on = ((G.time * 2) | 0) & 1;
      outText("R \u2014 TRY AGAIN        ESC \u2014 TITLE", HW, HH + 84, on ? "#ffd24a" : "#c8a83a", 19, "center");
    }
  }
}

/* -------------------------------------------------------------- CUTSCENE */

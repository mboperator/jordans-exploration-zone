/* ---------------------------------------------------------------- staging
   Bikini Bottom at night, in five parallax layers. Depth is the whole trick
   in a side-on chase: without it the runners look like they are jogging on
   the spot against wallpaper. */
const KELP_SEED = (() => { srand(77); const a = []; for (let i = 0; i < 40; i++) a.push(rnd()); return a; })();
function seaBg(scroll, warm) {
  /* 1 — water column, darker at the surface than the sand */
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#04182a"); g.addColorStop(0.55, "#093247"); g.addColorStop(1, "#0e4459");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  /* 2 — god rays, barely moving */
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 6; i++) {
    const x = ((i * 190 - scroll * 0.05) % (W + 400)) - 200;
    const rg = ctx.createLinearGradient(0, 0, 0, H * 0.9);
    rg.addColorStop(0, "rgba(150,225,255,0.13)"); rg.addColorStop(1, "rgba(150,225,255,0)");
    ctx.save(); ctx.translate(x, -50); ctx.rotate(0.19);
    ctx.fillStyle = rg; ctx.fillRect(-34, 0, 68, H + 90); ctx.restore();
  }
  ctx.restore();

  /* 3 — far dunes, hazed into the water */
  for (let k = 0; k < 3; k++) {
    const off = scroll * (0.06 + k * 0.09), base = 300 + k * 26;
    const sg = ctx.createLinearGradient(0, base - 40, 0, H);
    const a = 0.30 + k * 0.16;
    sg.addColorStop(0, "rgba(120,150,150," + a.toFixed(2) + ")");
    sg.addColorStop(1, "rgba(52,84,92," + a.toFixed(2) + ")");
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.moveTo(-40, H);
    for (let x = -40; x <= W + 40; x += 14)
      ctx.lineTo(x, base + Math.sin((x + off) * 0.006 + k * 2) * (26 - k * 5) + Math.sin((x + off) * 0.017 + k) * 8);
    ctx.lineTo(W + 40, H); ctx.closePath(); ctx.fill();
  }

  /* 4 — the sand they are actually running on */
  {
    const off = scroll * 0.34, base = 372;
    const sg = ctx.createLinearGradient(0, base - 34, 0, H);
    sg.addColorStop(0, warm ? "#e6cf92" : "#c9b986"); sg.addColorStop(1, warm ? "#8a7340" : "#7a6b44");
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.moveTo(-40, H);
    for (let x = -40; x <= W + 40; x += 10)
      ctx.lineTo(x, base + Math.sin((x + off) * 0.009) * 17 + Math.sin((x + off) * 0.024) * 6);
    ctx.lineTo(W + 40, H); ctx.closePath(); ctx.fill();
    /* ripples in the sand, so the ground reads as moving */
    ctx.strokeStyle = "rgba(90,74,42,0.30)"; ctx.lineWidth = 2;
    for (let i = 0; i < 16; i++) {
      const x = ((i * 96 - off * 1.4) % (W + 200)) - 100;
      const y = base + 34 + (i % 4) * 26;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 32, y - 5, x + 64, y); ctx.stroke();
    }
  }

  /* 5 — kelp whipping past close to camera, stalk plus fronds so it reads as
     a plant rather than a pole */
  for (let i = 0; i < 7; i++) {
    const x = ((i * 168 - scroll * 0.92) % (W + 400)) - 200;
    const h = 170 + KELP_SEED[i] * 130, lean = (KELP_SEED[i + 7] - 0.5) * 40;
    const pts = [];
    for (let j = 0; j <= 6; j++)
      pts.push([x + Math.sin(j * 0.8 + i + scroll * 0.005) * 15 + lean * j / 6, 424 - j * h / 6]);
    /* Leaves rather than twigs: each frond is a closed tapering blade with an
       ink edge and a lighter olive fill, so the kelp reads as a plant instead
       of the black sticks it used to be. */
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let j = 1; j < 6; j++) {
      const s2 = j % 2 ? 1 : -1;
      const bx = pts[j][0], by = pts[j][1];
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(bx + s2 * 30, by - 16, bx + s2 * 52, by + 10);
      ctx.quadraticCurveTo(bx + s2 * 28, by + 6, bx, by + 9);
      ctx.closePath();
      ctx.fillStyle = "#1d4a3e"; ctx.fill();
      ctx.strokeStyle = "#0d2b28"; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath();                                     // the midrib
      ctx.moveTo(bx, by + 3);
      ctx.quadraticCurveTo(bx + s2 * 28, by - 4, bx + s2 * 48, by + 9);
      ctx.strokeStyle = "rgba(96,170,130,0.45)"; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.strokeStyle = "#0d2b28"; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let j = 1; j <= 6; j++) ctx.lineTo(pts[j][0], pts[j][1]);
    ctx.stroke();
    ctx.strokeStyle = "#255a4a"; ctx.lineWidth = 8; ctx.stroke();
  }
}

/* dust kicked up by the runners, spawned on each footfall */
let cueDust = [];
function cuePuff(x, y) { if (cueDust.length < 60) cueDust.push({ x, y, t: 0, r: 5 + Math.random() * 6 }); }
function drawPuffs(dt, drift) {
  ctx.save();
  for (let i = cueDust.length - 1; i >= 0; i--) {
    const p = cueDust[i];
    p.t += dt; p.x -= drift * dt; p.y -= 12 * dt;
    if (p.t > 0.85) { cueDust.splice(i, 1); continue; }
    ctx.globalAlpha = 0.42 * (1 - p.t / 0.85);
    ctx.fillStyle = "#d9c795";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + p.t * 26, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

/* A runner, with a real cycle and a shadow raked across the sand. `gy` is the
   ground line -- the canvas is offset so the feet land on it rather than the
   caller guessing where inside the sprite the feet are. */
/* The two of you, drawn rather than blitted. `who` 0 is the player in whatever
   skin is equipped, 1 is Patrick. `gy` is the ground line and the figures are
   BUILT standing on it, so nothing floats and nothing sinks -- all the
   foot-fraction bookkeeping the voxel version needed simply goes away. */
const CUT_SCALE = [68, 63];
function cutCast(who) { return who ? skinById("patrick") : skinById(SAVE.equipped); }
function cutShadow(gx, gy, sc, w) {
  ctx.save(); ctx.globalAlpha = 0.30; ctx.fillStyle = "#0d1a22";
  ctx.beginPath(); ctx.ellipse(gx + 4, gy + 3, w * sc, 0.11 * sc, 0, 0, 6.2832); ctx.fill();
  ctx.restore();
}
function runner(gx, gy, s, phase, who) {
  const sc = CUT_SCALE[who] * s;
  cutShadow(gx, gy, sc, 0.50);
  toonFigure(gx, gy, sc, phase, cutCast(who), { mode: "run" });
}
/* stopped and breathing. `br` is a free-running breath clock rather than a
   stride, so the two of them heave out of step the way winded people do. */
function winded(gx, gy, s, br, who) {
  const sc = CUT_SCALE[who] * s;
  cutShadow(gx, gy, sc, 0.54);
  toonFigure(gx, gy, sc, br, cutCast(who), { mode: "winded" });
}

/* -------------------------------------------------------------- the bucket
   The Chum Bucket, as the show actually draws it. Three things identify it and
   the old version had none of them: the body TAPERS (narrow base flaring to a
   wide rim), a great steel HANDLE arcs over the top on two lugs, and the sign
   is a board bolted across the front. Straight sides with barrel hoops read as
   a crate, which is exactly how it was reading.

   Local space is unchanged -- body from y = 0 down to y = 190, origin on the
   centre line -- so every call site still places it correctly. */
const BKT_TOPW = 104, BKT_BOTW = 74, BKT_BOT = 190;
function bktPath() {
  const T = BKT_TOPW, B = BKT_BOTW, H2 = BKT_BOT;
  ctx.beginPath();
  ctx.moveTo(-T, 0);
  ctx.lineTo(-B, H2 - 18);
  ctx.quadraticCurveTo(-B + 2, H2, -B + 24, H2);
  ctx.lineTo(B - 24, H2);
  ctx.quadraticCurveTo(B - 2, H2, B, H2 - 18);
  ctx.lineTo(T, 0);
  ctx.closePath();
}
function chumBucket(x, y, s, open, lamp, shudder) {
  ctx.save(); ctx.translate(x + (shudder || 0), y); ctx.scale(s, s);
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  const T = BKT_TOPW, B = BKT_BOTW, H2 = BKT_BOT;
  const wAt = ty => T + (B - T) * (ty / H2);

  /* the handle first, so it passes behind the rim and reads as hung off the
     lugs rather than painted on the front */
  ctx.beginPath();
  ctx.moveTo(-T - 6, -4); ctx.quadraticCurveTo(0, -178, T + 6, -4);
  ctx.strokeStyle = INK_LINE; ctx.lineWidth = 22; ctx.stroke();
  ctx.strokeStyle = "#8b9099"; ctx.lineWidth = 13; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-T - 2, -14); ctx.quadraticCurveTo(0, -180, T - 10, -22);
  ctx.strokeStyle = "rgba(226,234,242,0.5)"; ctx.lineWidth = 4; ctx.stroke();

  /* the body */
  bktPath(); inkFill("#9b9d93", 7);
  ctx.save(); bktPath(); ctx.clip();
  /* rolled metal: vertical seams, then a wash that is brightest where the
     practical over the door throws its light */
  ctx.globalAlpha = 0.26;
  for (let i = -5; i <= 5; i++) {
    ctx.fillStyle = i % 2 ? "#7e8177" : "#adb0a5";
    ctx.beginPath();
    ctx.moveTo(i * T * 0.19 - T * 0.10, 0); ctx.lineTo(i * T * 0.19 + T * 0.075, 0);
    ctx.lineTo(i * B * 0.19 + B * 0.075, H2); ctx.lineTo(i * B * 0.19 - B * 0.10, H2);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 0.30; ctx.fillStyle = "#8a5a30";              // rust runs
  srand(41);
  for (let i = 0; i < 9; i++) {
    const rx = -T + rnd() * T * 2, ry = rnd() * H2 * 0.7;
    ctx.fillRect(rx, ry, 3 + rnd() * 3, 26 + rnd() * 60);
  }
  ctx.globalAlpha = 1;
  const lg2 = ctx.createLinearGradient(-T, 0, T, 0);
  lg2.addColorStop(0, "rgba(10,16,22,0.50)"); lg2.addColorStop(0.34, "rgba(0,0,0,0)");
  lg2.addColorStop(0.66, "rgba(0,0,0,0)"); lg2.addColorStop(1, "rgba(10,16,22,0.46)");
  ctx.fillStyle = lg2; ctx.fillRect(-T - 8, -8, T * 2 + 16, H2 + 16);
  ctx.restore();

  /* riveted bands, following the taper */
  for (const by of [26, 152]) {
    const w = wAt(by) + 3;
    ctx.beginPath(); ctx.rect(-w, by - 8, w * 2, 17);
    inkFill("#7c7f76", 4);
    ctx.fillStyle = "rgba(228,234,224,0.5)";
    for (let i = -4; i <= 4; i++) ctx.fillRect(i * w * 0.21 - 2.5, by - 2.5, 5, 5);
  }
  /* the rim, heavy and proud of the body */
  ctx.beginPath(); ctx.rect(-T - 11, -20, (T + 11) * 2, 23);
  inkFill("#a8ab9f", 6);
  ctx.fillStyle = "rgba(24,30,26,0.45)"; ctx.fillRect(-T - 11, -1, (T + 11) * 2, 5);
  for (const sd of [-1, 1]) {                                     // the handle lugs
    ctx.beginPath(); ctx.ellipse(sd * (T + 2), 12, 15, 17, 0, 0, 6.2832);
    inkFill("#8b9099", 5);
    ctx.beginPath(); ctx.ellipse(sd * (T + 2), 12, 5.5, 5.5, 0, 0, 6.2832);
    ctx.fillStyle = "#3c4148"; ctx.fill();
  }

  /* two small windows, lit from inside once the door opens */
  for (const sd of [-1, 1]) {
    ctx.beginPath(); roundRect(sd * 56 - 17, 76, 34, 30, 5);
    inkFill(open > 0.2 ? "#f2d189" : "#243036", 4.5);
    ctx.strokeStyle = "rgba(20,26,22,0.7)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sd * 56, 76); ctx.lineTo(sd * 56, 106); ctx.stroke();
  }

  /* the doorway: a hole in the metal, lit from inside as it opens */
  ctx.beginPath(); ctx.rect(-34, 122, 68, 68);
  inkFill("#0a0f0c", 5);
  if (open > 0.01) {
    const ig = ctx.createLinearGradient(0, 122, 0, 190);
    ig.addColorStop(0, "rgba(255,232,160," + (0.95 * open).toFixed(2) + ")");
    ig.addColorStop(1, "rgba(255,186,84," + (0.72 * open).toFixed(2) + ")");
    ctx.fillStyle = ig; ctx.fillRect(-34 + (1 - open) * 32, 122, 68 * open, 68);
  }
  const sw = 1 - open;                                            // the leaf on its hinge
  if (sw > 0.01) {
    ctx.beginPath(); ctx.rect(-34, 122, 68 * sw, 68);
    inkFill("#4e5a52", 4);
    if (sw > 0.4) { ctx.fillStyle = "#d8c078"; ctx.beginPath(); ctx.arc(-34 + 68 * sw - 12, 158, 4, 0, 6.2832); ctx.fill(); }
  }
  ctx.beginPath(); ctx.rect(-40, 116, 80, 8); inkFill("#6d716a", 4);   // the lintel
  ctx.beginPath(); ctx.rect(-46, 186, 92, 8); inkFill("#7a7d74", 4);   // the step

  /* the practical over the door */
  ctx.beginPath();
  ctx.moveTo(-15, 100); ctx.lineTo(15, 100); ctx.lineTo(9, 114); ctx.lineTo(-9, 114);
  ctx.closePath(); inkFill(lamp > 0.4 ? "#ffe9a8" : "#4f5348", 4);
  if (lamp > 0.1) {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const lgr = ctx.createRadialGradient(0, 110, 3, 0, 110, 104);
    lgr.addColorStop(0, "rgba(255,226,150," + (0.50 * lamp).toFixed(2) + ")");
    lgr.addColorStop(1, "rgba(255,196,90,0)");
    ctx.fillStyle = lgr; ctx.beginPath(); ctx.arc(0, 110, 104, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  /* the sign, bolted across the front */
  ctx.beginPath(); roundRect(-84, 44, 168, 42, 5);
  inkFill("#2c6a44", 5.5);
  ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fillRect(-80, 48, 160, 10);
  ctx.fillStyle = "rgba(0,0,0,0.28)"; ctx.fillRect(-80, 76, 160, 7);
  for (const sd of [-1, 1]) {
    ctx.beginPath(); ctx.arc(sd * 74, 65, 4, 0, 6.2832);
    ctx.fillStyle = "#cdd2c6"; ctx.fill();
  }
  outText("CHUM BUCKET", 0, 72, lamp > 0.4 ? "#e6ffd0" : "#8fb888", 20, "center");
  ctx.restore();
}

/* the wedge of light thrown out of the doorway, widening as it opens */
function lightWedge(dx, dy, dw, open, warm) {
  if (open <= 0.02) return;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const reach = 300 + open * 260, spread = 60 + open * 210;
  const g = ctx.createLinearGradient(dx, dy, dx - reach, dy + 130);
  g.addColorStop(0, "rgba(255,226,150," + (0.34 * open).toFixed(3) + ")");
  g.addColorStop(0.45, "rgba(255,200,110," + (0.15 * open).toFixed(3) + ")");
  g.addColorStop(1, "rgba(255,180,80,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(dx, dy - dw * 0.5);
  ctx.lineTo(dx, dy + dw * 0.5);
  ctx.lineTo(dx - reach, dy + dw * 0.5 + spread);
  ctx.lineTo(dx - reach, dy - dw * 0.5 - spread * 0.45);
  ctx.closePath(); ctx.fill();
  /* the pool it throws on the sand */
  const pg = ctx.createRadialGradient(dx - 60, 400, 10, dx - 60, 400, 300 * open + 90);
  pg.addColorStop(0, "rgba(255,222,140," + (0.30 * open).toFixed(3) + ")");
  pg.addColorStop(1, "rgba(255,200,110,0)");
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.ellipse(dx - 60, 400, 300 * open + 90, 62 * open + 20, 0, 0, 6.2832); ctx.fill();
  ctx.restore();
  if (warm) {
    /* motes drifting through the beam */
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = "rgba(255,235,180,0.5)";
    for (let i = 0; i < 22; i++) {
      const p = (i * 0.137 + G.time * 0.04) % 1;
      const mx = dx - p * reach, my = dy - 30 + Math.sin(i * 2.1 + G.time) * 40 + p * 90;
      ctx.globalAlpha = 0.5 * (1 - p) * open;
      ctx.fillRect(mx, my, 2, 2);
    }
    ctx.restore();
  }
}

/* long shadows raked toward camera by the doorway light */
function castShadow(x, y, len, wide, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = "#12202c";
  ctx.beginPath();
  ctx.moveTo(x - 16, y); ctx.lineTo(x + 16, y);
  ctx.lineTo(x - len + wide, y + 84); ctx.lineTo(x - len - wide, y + 84);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/* Plankton as a rim-lit silhouette in the doorway -- far more sinister than
   a fully lit model, and it is what a figure against a light actually is. */
function planktonSil(x, y, s, grin) {
  const P = skinById("plankton");
  /* drawn twice: once offset and rim-bright to catch the light coming past
     him, then flat black over the top. A figure against a doorway is a hole
     with an edge, and that is far more sinister than a lit model. */
  /* he is an inch tall and the doorway is a building -- that mismatch IS the
     shot, so he is deliberately dwarfed by the hole he is standing in */
  ctx.save();
  ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.55;
  ctx.filter = "brightness(2.6) saturate(0.4)";
  toonFigure(x + 2, y - 1.5, 57 * s, 0.6, P, { mode: "walk", gait: 0, grin: grin });
  ctx.restore();
  ctx.save();
  ctx.filter = "brightness(0.12) saturate(0.35)";
  toonFigure(x, y, 56 * s, 0.6, P, { mode: "walk", gait: 0, grin: grin });
  ctx.restore();
  ctx.filter = "none";
}

/* ------------------------------------------------------------- the grade
   Grain, a colour wash and a vignette, different for every beat, so the
   sequence reads as photographed rather than drawn. */
const GRAIN = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), id = g.createImageData(128, 128), d = id.data;
  srand(4242);
  for (let i = 0; i < 128 * 128; i++) {
    const v = 110 + rnd() * 90;
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255;
  }
  g.putImageData(id, 0, 0); return c;
})();
function cineGrade(tint, amt, vig, grain) {
  if (amt > 0.001) {
    ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = amt;
    ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  if (vig > 0.001) {
    const g = ctx.createRadialGradient(HW, HH, H * 0.20, HW, HH, H * 0.86);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0," + vig.toFixed(3) + ")");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (grain > 0.001 && !lowFX) {
    ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = grain;
    const ox = (Math.random() * 128) | 0, oy = (Math.random() * 128) | 0;
    for (let y = -oy; y < H; y += 128) for (let x = -ox; x < W; x += 128) ctx.drawImage(GRAIN, x, y);
    ctx.restore();
  }
}
function letterbox() {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, 44); ctx.fillRect(0, H - 44, W, 44);
}
/* speed streaks pulled backwards through the water */
function speedLines(scroll, n, a) {
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.strokeStyle = "rgba(190,235,255," + a + ")";
  ctx.lineWidth = 2; ctx.lineCap = "round";
  for (let i = 0; i < n; i++) {
    const x = ((i * 137 - scroll * 1.6) % (W + 320)) - 160;
    const y = 70 + ((i * 61) % 300);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 60 + (i % 5) * 20, y); ctx.stroke();
  }
  ctx.restore();
}

function drawCutscene() {
  const t = cueT, dt = 1 / 60;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

  if (cue === 0) {
    /* ---------------- 1. the run ---------------- */
    const scroll = t * 300;
    const shake = Math.sin(t * 26) * 1.6, cbob = Math.abs(Math.sin(t * 13)) * 3;
    ctx.save(); ctx.translate(shake, cbob);
    seaBg(scroll, false);
    /* the Krusty Krab falling away behind them */
    ctx.save();
    ctx.globalAlpha = Math.max(0, 0.9 - t * 0.16);
    const kx = 230 - t * 92, ks = Math.max(0.5, 1 - t * 0.10);
    ctx.translate(kx, 376); ctx.scale(ks, ks);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    /* The Krusty Krab is a boat, and the roofline is what says so -- flat
       rectangles read as a shed. Hull that flares out, a bowed roof, timber
       seams, portholes with real frames, and the sign up on its post. */
    ctx.beginPath();
    ctx.moveTo(-78, 0); ctx.lineTo(-96, -140);
    ctx.quadraticCurveTo(0, -168, 96, -140);
    ctx.lineTo(78, 0); ctx.closePath();
    inkFill("#5a3f1c", 5);
    ctx.save(); ctx.clip();
    ctx.strokeStyle = "rgba(30,20,8,0.55)"; ctx.lineWidth = 3;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath(); ctx.moveTo(-100, -18 - i * 28);
      ctx.quadraticCurveTo(0, -26 - i * 28, 100, -18 - i * 28); ctx.stroke();
    }
    ctx.fillStyle = "rgba(20,14,6,0.30)"; ctx.fillRect(24, -168, 90, 180);
    ctx.restore();
    ctx.beginPath();                                                   // the bowed roof
    ctx.moveTo(-108, -138); ctx.quadraticCurveTo(0, -186, 108, -138);
    ctx.quadraticCurveTo(0, -164, -108, -138); ctx.closePath();
    inkFill("#7d3a2c", 5);
    for (const px of [-52, 52]) {                                      // portholes
      ctx.beginPath(); ctx.arc(px, -92, 17, 0, 6.2832); inkFill("#24343e", 4);
      ctx.strokeStyle = "#8a6a34"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(px, -92, 17, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = "rgba(150,200,220,0.30)";
      ctx.beginPath(); ctx.arc(px - 5, -97, 6, 0, 6.2832); ctx.fill();
    }
    ctx.beginPath(); roundRect(-24, -58, 48, 58, 4); inkFill("#6b4a1e", 4);   // doors
    ctx.strokeStyle = "#2a1c0a"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -58); ctx.lineTo(0, 0); ctx.stroke();
    ctx.strokeStyle = "#3a2a12"; ctx.lineWidth = 6;                    // the sign post
    ctx.beginPath(); ctx.moveTo(-64, -150); ctx.lineTo(-64, -196); ctx.stroke();
    ctx.beginPath(); roundRect(-66, -222, 132, 30, 4); inkFill("#8d4030", 4.5);
    outText("KRUSTY KRAB", 0, -201, "#f0d9a4", 13, "center");
    ctx.restore();
    /* the Chum Bucket growing ahead */
    chumBucket(W - 60 + Math.max(0, 560 - t * 118), 246, 0.60, 0, 1, 0);

    const ph0 = t * 17, ph1 = t * 17 + 2.1;
    if (Math.floor(ph0 / Math.PI) !== Math.floor((ph0 - 17 * dt) / Math.PI)) cuePuff(330, 398);
    if (Math.floor(ph1 / Math.PI) !== Math.floor((ph1 - 17 * dt) / Math.PI)) cuePuff(214, 406);
    drawPuffs(dt, 300);
    runner(322, 396, 1.42, ph0, 0);
    runner(214, 404, 1.38, ph1, 1);
    speedLines(scroll, 14, 0.20);
    drawAmbientBubbles(0.016);
    ctx.restore();
    letterbox();
    cineGrade("#3f6ea8", 0.30, 0.36, 0.055);
    outText("You don't look back.", HW, H - 14, "#c8c8d0", 15, "center");

  } else if (cue === 1) {
    /* ---------------- 2. the door ---------------- */
    const knock = (t > 0.55 && t < 0.75) || (t > 1.05 && t < 1.25);
    const sh = knock ? Math.sin(t * 90) * 3.5 : 0;
    seaBg(1420, false);
    chumBucket(W - 250, 206, 0.92, 0, 1, sh);
    /* dust shaken loose through the lamplight */
    if (knock) for (let i = 0; i < 2; i++) cuePuff(W - 250 + (Math.random() - 0.5) * 120, 268);
    drawPuffs(dt, 0);
    /* doubled over, chests heaving -- and heaving out of step with each other */
    winded(334, 396, 1.42, t * 3.6, 0);
    winded(224, 404, 1.38, t * 2.9 + 1.7, 1);
    drawAmbientBubbles(0.016);
    letterbox();
    cineGrade("#3f6ea8", 0.26, 0.40, 0.05);
    if (t > 0.5) outText("knock… knock…", HW, H - 14, "#f0f0f0", 17, "center");

  } else if (cue === 2) {
    /* ---------------- 3. "PLEASE, COME IN!" ---------------- */
    const open = Math.min(1, Math.max(0, (t - 0.25) / 0.9));
    const warm = open;
    seaBg(1420, warm > 0.4);
    lightWedge(W - 288, 300, 100, open, true);
    chumBucket(W - 250, 206, 0.92, open, 1, 0);
    if (open > 0.35) planktonSil(W - 250, 350, 0.92, 0.12);
    /* their shadows thrown back at the camera */
    castShadow(334, 398, 150 * open, 30, 0.42 * open);
    castShadow(224, 406, 150 * open, 30, 0.42 * open);
    /* still winded, but straightening up as the light reaches them */
    winded(334, 396, 1.42, 3.0 + t * 3.0, 0);
    winded(224, 404, 1.38, 3.0 + t * 2.4 + 1.7, 1);
    drawPuffs(dt, 0);
    drawAmbientBubbles(0.016);
    letterbox();
    cineGrade("#e0a860", 0.14 * open, 0.34, 0.05);
    if (t > 1.0) {
      ctx.save(); ctx.shadowColor = "rgba(180,255,110,0.9)"; ctx.shadowBlur = 18;
      outText("“PLEASE — COME IN!”", HW, H - 12, "#c8f07a", 24, "center");
      ctx.restore();
    }

  } else if (cue === 3) {
    /* ---------------- 4. walking in ---------------- */
    const p = Math.min(1, t / 2.2), push = 1 + p * 0.16;
    seaBg(1420, true);
    ctx.save();
    ctx.translate(HW * (1 - push) + (W - 300) * (push - 1) * 0.25, HH * (1 - push));
    ctx.scale(push, push);
    lightWedge(W - 288, 300, 100, 1, true);
    chumBucket(W - 250, 206, 0.92, 1, 1, 0);
    planktonSil(W - 250, 350, 0.92, 0.2 + p * 0.15);
    castShadow(330 + p * 150, 398, 150, 30, 0.42 * (1 - p * 0.6));
    castShadow(224 + p * 210, 406, 150, 30, 0.42 * (1 - p * 0.6));
    /* they walk into the light and go to silhouette as they cross it */
    ctx.save();
    if (p > 0.25) ctx.filter = "brightness(" + (1 - (p - 0.25) * 1.15).toFixed(2) + ")";
    runner(330 + p * 190, 396 - p * 34, 1.42 - p * 0.70, t * 7 + 0.2, 0);
    runner(224 + p * 282, 404 - p * 44, 1.38 - p * 0.70, t * 7 + 2.3, 1);
    ctx.filter = "none";
    ctx.restore();
    ctx.restore();
    drawAmbientBubbles(0.016);
    letterbox();
    cineGrade("#e0a860", 0.22, 0.36, 0.05);
    if (t > 1.3) outText("Patrick waves.", HW, H - 14, "#ffb0c0", 15, "center");

  } else if (cue === 4) {
    /* ---------------- 5. the grin ---------------- */
    const p = Math.min(1, t / CUE[4].d);
    /* it stretches the whole way across the beat rather than snapping */
    const grin = Math.min(1, Math.max(0, (t - 0.45) / 2.2));
    const flick = (Math.sin(t * 31) > 0.82 || Math.sin(t * 17.3) > 0.93) ? 0.55 : 1;
    const g = ctx.createLinearGradient(0, H, 0, 0);
    g.addColorStop(0, "#6a5620"); g.addColorStop(0.45, "#1d1a12"); g.addColorStop(1, "#08080a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    /* the doorway behind him, flickering */
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const bg2 = ctx.createRadialGradient(HW, HH + 130, 20, HW, HH + 130, 340);
    bg2.addColorStop(0, "rgba(255,206,110," + (0.30 * flick).toFixed(3) + ")");
    bg2.addColorStop(1, "rgba(255,180,70,0)");
    ctx.fillStyle = bg2; ctx.fillRect(0, 0, W, H);
    ctx.restore();
    /* hard uplight, and a slow creep in */
    ctx.save();
    ctx.filter = "brightness(" + (0.86 + flick * 0.34).toFixed(2) + ")";
    /* An actual close-up. This beat is nothing but the grin, and at the old
       distance the face was a third the height of the letterboxed band -- the
       teeth were four pixels. Framed off the figure's real extents: his antennae
       reach 0.74 above the ground line and the chin sits at 0.16, so the whole
       head-and-antennae is 0.58 units against a 412px band. Antennae just inside
       the top bar, chin just above the bottom one, creeping closer as it holds. */
    toonFigure(HW, HH + 268 + p * 14, 600 + p * 50, 0.6, skinById("plankton"),
               { mode: "walk", gait: 0, grin: grin });
    ctx.filter = "none";
    ctx.restore();
    letterbox();
    cineGrade("#6ad06a", 0.20, 0.30 + p * 0.34, 0.075);
    if (t > 1.5) outText("“I've been waiting a LONG time for this.”", HW, H - 12, "#c8f07a", 19, "center");

  } else if (cue === 5) {
    /* ---------------- 6. the slam ---------------- */
    const s = Math.min(1, t / 0.30), e = s * s;
    const g = ctx.createLinearGradient(0, H, 0, 0);
    g.addColorStop(0, "#6a5620"); g.addColorStop(0.45, "#1d1a12"); g.addColorStop(1, "#08080a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    /* matched to where beat 5 left him, or the cut reads as a camera jump */
    toonFigure(HW, HH + 282, 650, 0.6, skinById("plankton"), { mode: "walk", gait: 0, grin: 1 });
    /* both leaves drive in from the sides, smeared by their own speed */
    const lw = W * 0.52;
    for (let k = 4; k >= 0; k--) {
      const back = e - k * 0.055;
      if (back <= 0) continue;
      ctx.globalAlpha = k === 0 ? 1 : 0.16;
      ctx.fillStyle = "#0b0a08";
      ctx.fillRect(-lw + back * lw, 0, lw, H);
      ctx.fillRect(W - back * lw, 0, lw, H);
    }
    ctx.globalAlpha = 1;
    if (t > 0.30) {
      /* dust bursts out of the seam, then the frame goes */
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - (t - 0.30) * 4);
      ctx.fillStyle = "#c9b795";
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * 6.2832, r = (t - 0.30) * 520;
        ctx.beginPath(); ctx.arc(HW + Math.cos(a) * r * 0.7, HH + Math.sin(a) * r * 0.35, 16 + r * 0.12, 0, 6.2832); ctx.fill();
      }
      ctx.restore();
    }
    if (t > 0.42) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); }
    letterbox();

  } else {
    /* ---------------- 7. the card ---------------- */
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    if (t > 1.5) {
      const a = Math.min(1, (t - 1.5) * 0.8);
      const drift = Math.sin(t * 0.5) * 4;
      ctx.save(); ctx.globalAlpha = a;
      ctx.shadowColor = "rgba(255,214,140,0.75)"; ctx.shadowBlur = 26 + Math.sin(t * 1.7) * 8;
      outText("PART 2 COMING SOON!", HW, HH + 6 + drift, "#ffffff", 44, "center");
      ctx.shadowBlur = 0;
      ctx.globalAlpha = a * (0.55 + 0.45 * Math.abs(Math.sin(t * 1.4)));
      outText("press any key", HW, HH + 50 + drift, "#c8c8d0", 15, "center");
      ctx.restore();
    }
    cineGrade("#000000", 0, 0.20, 0.04);
  }
  if (cue < 6) outText("SPACE — skip", W - 16, 32, "#9a9aa2", 12, "right");
}

/* ------------------------------------------------------------------ INPUT */
const keys = {};
let mouseDX = 0, locked = false;

/* Mouse-look is a bonus. If the browser refuses pointer lock (sandboxed
   frame, permissions policy) the arrow keys still turn, so the game stays
   completely playable. */
function lockPointer() {
  if (!cv.requestPointerLock) return;
  try { const p = cv.requestPointerLock(); if (p && p.catch) p.catch(() => { }); } catch (e) { }
}
document.addEventListener("pointerlockchange", () => { locked = document.pointerLockElement === cv; });
document.addEventListener("mousemove", e => { if (locked && G.state === "PLAY" && !G.dial) mouseDX += e.movementX; });

function startPlay() {
  const keep = G.state;
  newGame();
  G.state = "PLAY"; G.playTime = 0;
  lockPointer();
  G.introT = INTRO_HOLD;                  // the objective card, see drawIntro
  toast("Closing time. The doors are bolted and boarded.", 4.5);
  toast(DIFFS[diffIdx].name + " — " + DIFFS[diffIdx].blurb, 5.5);
}
function toTitle() {
  G.state = "TITLE";
  document.exitPointerLock && document.exitPointerLock();
}

addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Tab"].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return;
  keys[e.code] = true;
  initAudio();

  if (e.code === "KeyM") {
    muted = !muted; if (master) master.gain.value = muted ? 0 : 0.55;
    toast(muted ? "SOUND OFF" : "SOUND ON", 1.4); return;
  }

  if (G.state === "TITLE") {
    if (e.code === "Space" || e.code === "Enter") { startPlay(); return; }
    if (e.code === "ArrowLeft") { diffIdx = (diffIdx + 2) % 3; blip(500, 0.05, "sine", 0.1); return; }
    if (e.code === "ArrowRight") { diffIdx = (diffIdx + 1) % 3; blip(560, 0.05, "sine", 0.1); return; }
    if (e.code === "Digit1") { diffIdx = 0; return; }
    if (e.code === "Digit2") { diffIdx = 1; return; }
    if (e.code === "Digit3") { diffIdx = 2; return; }
    /* the shop shows toasts for its own feedback, so clear the run's ones
       on the way in rather than letting them bleed across the screens */
    if (e.code === "KeyB") { G.state = "SHOP"; G.toasts = []; blip(660, 0.06, "sine", 0.12); return; }
    return;
  }
  if (G.state === "SHOP") {
    if (e.code === "KeyB" || e.code === "Escape") { G.state = "TITLE"; return; }
    if (e.code === "ArrowLeft") { shopMove(-1, 0); return; }
    if (e.code === "ArrowRight") { shopMove(1, 0); return; }
    if (e.code === "ArrowUp") { shopMove(0, -1); return; }
    if (e.code === "ArrowDown") { shopMove(0, 1); return; }
    if (e.code === "KeyE" || e.code === "Enter" || e.code === "Space") { shopAct(); return; }
    return;
  }
  if (G.state === "CAUGHT") {
    if (G.caughtT < 1.3) return;
    if (e.code === "KeyR" || e.code === "Space" || e.code === "Enter") { startPlay(); return; }
    if (e.code === "Escape") { toTitle(); return; }
    return;
  }
  if (G.state === "WIN") {
    if (e.code === "KeyB") { G.state = "SHOP"; G.toasts = []; return; }
    if (e.code === "KeyR" || e.code === "Space" || e.code === "Enter") { startPlay(); return; }
    if (e.code === "Escape") { toTitle(); return; }
    return;
  }
  if (G.state === "CUTSCENE") {
    if (cue >= CUE.length - 1) { if (cueT > 1.6) cueSkip(); return; }
    if (e.code === "Space" || e.code === "Escape" || e.code === "Enter") { cueSkip(); return; }
    return;
  }

  /* ---- PLAY ---- */
  if (e.code === "Escape") { if (G.dial) { G.dial = null; return; } if (G.act) { cancelAct(); return; } toTitle(); return; }
  if (e.code === "KeyR") { startPlay(); return; }
  if (G.dial) {
    if (e.code === "ArrowLeft") { moveDial(-1); return; }
    if (e.code === "ArrowRight") { moveDial(1); return; }
    if (e.code === "ArrowUp") { turnDial(1); return; }
    if (e.code === "ArrowDown") { turnDial(-1); return; }
    if (e.code === "KeyE" || e.code === "Enter") { commitDial(); return; }
    return;
  }
  if (e.code === "KeyE") { interact(); return; }
  if (e.code === "KeyF") { if (!G.act) fire(); return; }
  const d = /^(Digit|Numpad)([1-5])$/.exec(e.code);
  if (d) { equipKey(+d[2] - 1); return; }
  const g = /^(Digit|Numpad)([678])$/.exec(e.code);
  if (g) equipTool(["hammer", "plank", "gun"][+g[2] - 6]);
});
addEventListener("keyup", e => { keys[e.code] = false; });

function equipTool(which) {
  const has = which === "gun" ? G.hasGun : which === "hammer" ? G.hasHammer : G.hasPlank;
  const name = which === "gun" ? "BUBBLE GUN" : which === "hammer" ? "HAMMER" : "PLANK";
  if (!has) {
    toast("You haven't got the " + name + ".", 1.8);
    blip(120, 0.09, "square", 0.09); return;
  }
  if (G.tool === which) {
    G.tool = null; toast("Put the " + name + " away.", 1.4);
    blip(280, 0.05, "sine", 0.09); return;
  }
  G.tool = which;
  toast(name + " in hand.", 1.6);
  blip(620, 0.05, "sine", 0.12); blip(880, 0.06, "sine", 0.09);
}
function equipKey(i) {
  const k = KEYDEF[i];
  if (!G.keys[k.id]) {
    toast("You haven't found the " + k.name + " yet.", 1.8);
    blip(120, 0.09, "square", 0.09); return;
  }
  if (G.used[k.id]) {
    toast("The " + k.name + " is spent — it broke off in the lock.", 2.4);
    blip(120, 0.09, "square", 0.09); return;
  }
  if (G.held === k.id) {
    G.held = null; toast("Put the " + k.name + " away.", 1.4);
    blip(300, 0.05, "sine", 0.09); return;
  }
  G.held = k.id;
  toast("Holding the " + k.name + ".", 1.8);
  blip(720, 0.05, "sine", 0.13); blip(960, 0.06, "sine", 0.1);
}

cv.addEventListener("mousedown", e => {
  initAudio();
  if (G.state === "TITLE") { startPlay(); return; }
  if (G.state === "CUTSCENE") { if (cue >= CUE.length - 1) { if (cueT > 1.6) cueSkip(); } else cueSkip(); return; }
  if (G.state === "SHOP") { shopAct(); return; }
  if (G.state !== "PLAY") return;
  if (!locked) { lockPointer(); return; }
  if (e.button === 0 && !G.act && !G.dial) fire();
});
cv.addEventListener("mousemove", e => {
  if (G.state !== "SHOP") return;
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (W / r.width), my = (e.clientY - r.top) * (H / r.height);
  const gw = SHOP_COLS * CARD_W + (SHOP_COLS - 1) * CARD_GAP;
  const gx = (W - gw) / 2, gy = 88;
  const c = Math.floor((mx - gx) / (CARD_W + CARD_GAP)), rr = Math.floor((my - gy) / (CARD_H + CARD_GAP));
  if (c >= 0 && c < SHOP_COLS && rr >= 0 && rr < SHOP_ROWS) {
    const i = (rr + shopScroll) * SHOP_COLS + c;
    if (i >= 0 && i < SKINS.length) shopSel = i;
  }
});
cv.addEventListener("wheel", e => {
  if (G.state !== "SHOP") return;
  e.preventDefault();
  const rows = Math.ceil(SKINS.length / SHOP_COLS);
  shopScroll = Math.max(0, Math.min(Math.max(0, rows - SHOP_ROWS), shopScroll + (e.deltaY > 0 ? 1 : -1)));
}, { passive: false });

/* ------------------------------------------------------------------- LOOP */
function resize() {
  const s = Math.max(0.4, Math.min(innerWidth / W, innerHeight / H));
  cv.style.width = (W * s) | 0 ? ((W * s) | 0) + "px" : W + "px";
  cv.style.height = ((H * s) | 0) + "px";
}
addEventListener("resize", resize);

/* adaptive quality: if the machine can't hold the frame rate, drop the
   floor cast to half resolution and switch the caustics off rather than
   letting the whole thing stutter. */
let perfN = 0, perfSum = 0;
function perfCheck(dt) {
  if (lowFX || perfN > 180) return;
  perfN++; perfSum += dt;
  if (perfN === 180 && perfSum / perfN > 1 / 46) {
    lowFX = true;
    console.log("Krusty Krab Escape: dropping to half-res floors to hold the frame rate.");
  }
}

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  update(dt);

  if (G.state === "TITLE") drawTitle();
  else if (G.state === "SHOP") drawShop();
  else if (G.state === "CUTSCENE") drawCutscene();
  else if (G.state === "WIN") drawWin();
  else {
    render();
    drawBloom(0.13);
    drawAmbientBubbles(dt);
    drawPost();
    drawHUD();
    drawIntro();
    if (G.state === "CAUGHT") drawCaught();
    perfCheck(dt);
  }
  requestAnimationFrame(frame);
}

newGame();
resize();
requestAnimationFrame(frame);
</script>

<!DOCTYPE html>

    font-family:"Trebuchet MS",Verdana,sans-serif;}

<body>
<div id="wrap"><canvas id="cv" width="800" height="500"></canvas></div>
<script>
/* ======================================================================
   KRUSTY KRAB ESCAPE
   A first-person raycaster. Every material, sprite, sound
   and frame of the cutscene is generated in code -- no external assets,
   no network, one file.

   Piggy runs the game loop; the art aims for real materials and light.
   ====================================================================== */

const W = 800, H = 500, HW = W >> 1, HH = H >> 1;
const MAPW = 48, MAPH = 40;

/* ---------------------------------------------------------------- TUNING */
const TUNING = {
  walkSpeed:      3.2,     // tiles / sec
  sprintSpeed:    5.0,
  crouchSpeed:    1.35,
  strafeMul:      0.82,
  backMul:        0.72,
  turnSpeed:      2.7,     // rad / sec (keyboard)
  mouseSens:      0.0023,
  fov:            Math.PI / 3,
  flashRange:     13.5,
  flashCone:      0.95,
  ambient:        0.30,    // Granny-dark: the torch does nearly all the work

  eyeStand:       0.50,
  eyeCrouch:      0.30,

  bobCatchDist:   0.60,
  enrageMul:      1.20,    // after Patrick is freed

  staminaDrain:   1.0,     // set from difficulty
  staminaRefill:  0.34,
  windedFloor:    0.45,    // must refill past this to sprint again

  noiseWalk:      9.0,     // tiles -- how far your footsteps carry
  noiseSprint:    15.0,
  noiseGrease:    13.0,
  noiseShot:      22.0,
  noiseHammer:    26.0,
  noiseDial:      11.0,
  noiseInterval:  0.42,
  patrickNoise:   4.0,     // added radius while Patrick tags along

  maxAmmo:        6,
  playerRadius:   0.26,
  smashKitchen:   3,       // hammer swings
  smashFront:     4,
  plankTime:      1.1,     // nailing wind-up
  chainTime:      3.2,     // freeing Patrick -- the long one
  swingTime:      0.55,
  patrickNear:    3.2,     // how close he must be to escape with you
};

/* difficulty -> overrides. INTERMEDIATE is the default. */
const DIFFS = [
  { name: "EASY", blurb: "He is slow and half blind.",
    roam: 1.30, hunt: 1.60, chase: 1.90, sight: 8.0, hear: 6.0,
    stamina: 5.5, refill: 0.45, bottles: 12, stun: 22, dial: 0.10, pnoise: 2.0 },
  { name: "INTERMEDIATE", blurb: "Slower than you. Never stops walking.",
    roam: 1.60, hunt: 2.00, chase: 2.40, sight: 11.0, hear: 9.0,
    stamina: 4.0, refill: 0.34, bottles: 8, stun: 18, dial: 0.14, pnoise: 4.0 },
  { name: "HARD", blurb: "Once Patrick is loose he outruns a walk.",
    roam: 1.90, hunt: 2.40, chase: 2.90, sight: 14.0, hear: 12.0,
    stamina: 3.0, refill: 0.24, bottles: 5, stun: 12, dial: 0.19, pnoise: 6.0 }
];
let diffIdx = 1;
const DIFF = () => DIFFS[diffIdx];

/* ------------------------------------------------------------------- MAP
   #  timber wall     L  hiding spot        S  steam vent
   .  floor           ~  grease spill       N  note
   G  grease pit (impassable until planked)  p  plank laid across
   B  boarded doorway (hammer through)       F  Krabs' safe
   C  Patrick's chains                       X  front doors (boarded)
   r b g y  colour-locked doors                                        */

const DINING = [               /* x 1..14 , y 1..13 */
  "..............",
  ".##.....##....",
  ".##.....##....",
  "..............",
  ".##.....##....",
  ".##.....##....",
  "..........C...",
  ".##.....##....",
  ".##.....##....",
  "..............",
  ".##.....##....",
  ".##.....##....",
  ".............."
];
const OFFICE = [               /* x 17..30 , y 1..13 */
  ".F............",
  "..............",
  "..............",
  "...####.......",
  "...####.......",
  "..............",
  "..............",
  "..............",
  ".......####...",
  ".......####...",
  "..............",
  "..N...........",
  ".............."
];
const KITCHEN = [              /* x 33..46 , y 1..13 */
  "..............",
  "..N.........~~",
  "..............",
  "GGGGGGGGGGGGGG",
  "..............",
  "..S........S..",
  "..............",
  "..####..####..",
  "..####..####..",
  "..~~..........",
  "..............",
  "..............",
  ".............."
];
const BASEMENT = [             /* x 1..14 , y 26..38 */
  "..............",
  "..##......##..",
  "..##......##..",
  "..............",
  "......####....",
  "......####....",
  "..............",
  "..............",
  "..##......##..",
  "..##......##..",
  "..N...........",
  "..............",
  ".............."
];
const FREEZER = [              /* x 17..30 , y 26..38 */
  "..............",
  ".LL....####...",
  "..............",
  "..####....LL..",
  "..............",
  "..............",
  "..............",
  "..............",
  "..####....##..",
  "..............",
  ".N.........L..",
  "..............",
  ".............."
];
const DOCK = [                 /* x 33..46 , y 26..38 */
  "..............",
  "..............",
  "..####........",
  "..####........",
  "..............",
  "..####........",
  "..............",
  "..............",
  ".........#####",
  ".........#....",
  ".........G....",
  ".........#....",
  ".........#...."
];

const MAP = [];
(function buildMap() {
  MAP.push("#".repeat(6) + "XX" + "#".repeat(40));            // y0  front doors
  for (let i = 0; i < 13; i++) {
    const y = i + 1;
    const sepA = (y === 7) ? "yy" : "##";     // dining | office  YELLOW
    const sepB = (y === 7) ? "rr" : "##";     // office | kitchen RED
    MAP.push("#" + DINING[i] + sepA + OFFICE[i] + sepB + KITCHEN[i] + "#");
  }
  /* the two vertical shafts: left joins dining<->basement, right joins
     kitchen<->dock and carries the boarded doorway. */
  const MID  = "#".repeat(7) + ".." + "#".repeat(30) + ".." + "#".repeat(7);
  const MIDB = "#".repeat(7) + ".." + "#".repeat(30) + "BB" + "#".repeat(7);
  for (let y = 14; y <= 25; y++) MAP.push(y === 20 ? MIDB : MID);
  for (let i = 0; i < 13; i++) {
    const y = i + 26;
    const sepA = (y === 32) ? "gg" : "##";    // basement | freezer GREEN
    const sepB = (y === 32) ? "bb" : "##";    // freezer  | dock    BLUE
    MAP.push("#" + BASEMENT[i] + sepA + FREEZER[i] + sepB + DOCK[i] + "#");
  }
  MAP.push("#".repeat(48));                                   // y39
  for (let y = 0; y < MAP.length; y++)
    if (MAP[y].length !== MAPW) console.error("BAD ROW", y, MAP[y].length);
  if (MAP.length !== MAPH) console.error("BAD MAP HEIGHT", MAP.length);
})();

/* GRID is mutable -- planks, smashed boards and opened doors rewrite it */
const GRID = new Uint8Array(MAPW * MAPH);
const GRID0 = new Uint8Array(MAPW * MAPH);
for (let y = 0; y < MAPH; y++)
  for (let x = 0; x < MAPW; x++) GRID0[y * MAPW + x] = MAP[y].charCodeAt(x);
const resetGrid = () => GRID.set(GRID0);
resetGrid();

const ch = (x, y) => (x < 0 || y < 0 || x >= MAPW || y >= MAPH)
  ? 35 : GRID[y * MAPW + x];
const setCh = (x, y, c) => { if (x >= 0 && y >= 0 && x < MAPW && y < MAPH) GRID[y * MAPW + x] = c; };

const C_WALL = 35, C_DOT = 46, C_GREASE = 126, C_PIT = 71, C_PLANK = 112,
      C_BOARD = 66, C_HIDE = 76, C_STEAM = 83, C_NOTE = 78, C_SAFE = 70,
      C_CHAIN = 67, C_EXIT = 88,
      C_r = 114, C_b = 98, C_g = 103, C_y = 121;

/* which zone is a tile in?  drives the coloured lighting */
const Z_DINING = 0, Z_OFFICE = 1, Z_KITCHEN = 2,
      Z_BASEMENT = 3, Z_FREEZER = 4, Z_DOCK = 5, Z_SHAFT = 6;
function zoneAt(x, y) {
  if (y <= 13) { if (x <= 15) return Z_DINING; if (x <= 31) return Z_OFFICE; return Z_KITCHEN; }
  if (y >= 26) { if (x <= 15) return Z_BASEMENT; if (x <= 31) return Z_FREEZER; return Z_DOCK; }
  return Z_SHAFT;
}
/* per-zone light tint (r,g,b multipliers x256) and a name for the HUD */
const ZONE = [
  { tint: [268, 240, 196], name: "DINING ROOM"  },  // warm lamp amber
  { tint: [252, 236, 208], name: "KRABS' OFFICE"},  // dusty tungsten
  { tint: [272, 232, 190], name: "KITCHEN"      },  // hot grill orange
  { tint: [214, 248, 214], name: "BASEMENT"     },  // sickly fluorescent
  { tint: [206, 234, 272], name: "FREEZER"      },  // cold blue-white
  { tint: [222, 240, 258], name: "LOADING DOCK" },  // moonlit
  { tint: [228, 240, 252], name: ""             }   // corridor
];

/* -------------------------------------------------------------- RNG / GFX */
let _s = 1;
const srand = s => { _s = (s >>> 0) || 1; };
function rnd() {
  _s ^= _s << 13; _s >>>= 0; _s ^= _s >> 17; _s ^= _s << 5; _s >>>= 0;
  return _s / 4294967296;
}
const col = (r, g, b, a) => (((a === undefined ? 255 : a) << 24) |
  ((b & 255) << 16) | ((g & 255) << 8) | (r & 255)) >>> 0;
const clamp255 = v => v < 0 ? 0 : v > 255 ? 255 : v | 0;
function mix(c1, c2, t) {
  const r = (c1 & 255) + ((c2 & 255) - (c1 & 255)) * t;
  const g = ((c1 >>> 8) & 255) + (((c2 >>> 8) & 255) - ((c1 >>> 8) & 255)) * t;
  const b = ((c1 >>> 16) & 255) + (((c2 >>> 16) & 255) - ((c1 >>> 16) & 255)) * t;
  return col(r, g, b);
}
const shade = (c, f) => col((c & 255) * f, ((c >>> 8) & 255) * f, ((c >>> 16) & 255) * f);

const TS = 128, TM = TS - 1, TA = TS * TS;
function nt() { return new Uint32Array(TA); }
function P(t, x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < TS && y < TS) t[y * TS + x] = c; }
function PW(t, x, y, c) { t[((y & TM) * TS) + (x & TM)] = c; }
function R(t, x, y, w, h, c) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) P(t, i, j, c);
}
function RW(t, x, y, w, h, c) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) PW(t, i, j, c);
}
function CIR(t, cx, cy, r, c) {
  const r2 = r * r;
  for (let j = (cy - r) | 0; j <= cy + r; j++) for (let i = (cx - r) | 0; i <= cx + r; i++) {
    const dx = i - cx, dy = j - cy; if (dx * dx + dy * dy <= r2) P(t, i, j, c);
  }
}
function RING(t, cx, cy, r, w, c) {
  const ro = r * r, ri = (r - w) * (r - w);
  for (let j = (cy - r) | 0; j <= cy + r; j++) for (let i = (cx - r) | 0; i <= cx + r; i++) {
    const dx = i - cx, dy = j - cy, d = dx * dx + dy * dy;
    if (d <= ro && d >= ri) P(t, i, j, c);
  }
}
function ELL(t, cx, cy, rx, ry, c) {
  for (let j = (cy - ry) | 0; j <= cy + ry; j++) for (let i = (cx - rx) | 0; i <= cx + rx; i++) {
    const dx = (i - cx) / rx, dy = (j - cy) / ry;
    if (dx * dx + dy * dy <= 1) P(t, i, j, c);
  }
}
function LINE(t, x0, y0, x1, y1, c, w) {
  w = w || 1;
  const dx = x1 - x0, dy = y1 - y0, n = Math.max(1, Math.max(Math.abs(dx), Math.abs(dy)) | 0);
  for (let i = 0; i <= n; i++) {
    const x = x0 + dx * i / n, y = y0 + dy * i / n;
    if (w <= 1) P(t, x, y, c); else CIR(t, x, y, w / 2, c);
  }
}

/* ------------------------------------------------------------------ NOISE
   Real materials need real noise. Value noise plus fbm gives grain, rust,
   aggregate and dirt without a single external asset. */
const NSZ = 64, NM = NSZ - 1;
function noiseField(seed) {
  srand(seed);
  const f = new Float32Array(NSZ * NSZ);
  for (let i = 0; i < f.length; i++) f[i] = rnd();
  return f;
}
const NF = [noiseField(11), noiseField(23), noiseField(37), noiseField(51)];
function smoothNoise(f, x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const tx = x - xi, ty = y - yi;
  const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
  const a = f[(yi & NM) * NSZ + (xi & NM)],       b = f[(yi & NM) * NSZ + ((xi + 1) & NM)];
  const c = f[((yi + 1) & NM) * NSZ + (xi & NM)], d = f[((yi + 1) & NM) * NSZ + ((xi + 1) & NM)];
  return (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
}
/* fractal noise, 0..1, tiles cleanly at the texture edge */
function fbm(x, y, oct, scale, fi) {
  const f = NF[fi === undefined ? 0 : fi];
  let v = 0, amp = 0.5, s = scale, tot = 0;
  for (let i = 0; i < oct; i++) {
    v += smoothNoise(f, x * s, y * s) * amp;
    tot += amp; amp *= 0.5; s *= 2;
  }
  return v / tot;
}
/* apply a per-pixel brightness field to a texture */
function modulate(t, fn) {
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const i = y * TS + x, c = t[i];
    if ((c >>> 24) === 0) continue;
    const m = fn(x, y);
    t[i] = col(clamp255((c & 255) * m), clamp255(((c >>> 8) & 255) * m),
               clamp255(((c >>> 16) & 255) * m), c >>> 24);
  }
}
/* fake a lit surface from a height field: brighter where it slopes toward
   the light, darker where it slopes away. This is what sells relief. */
function reliefLight(t, height, strength) {
  const out = t.slice();
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const i = y * TS + x, c = t[i];
    if ((c >>> 24) === 0) continue;
    const hl = height[(y * TS) + ((x - 1) & TM)], hr = height[(y * TS) + ((x + 1) & TM)];
    const hu = height[(((y - 1) & TM) * TS) + x], hd = height[(((y + 1) & TM) * TS) + x];
    const nx = (hl - hr), ny = (hu - hd);
    const m = 1 + (nx * 0.55 + ny * 0.85) * strength;
    out[i] = col(clamp255((c & 255) * m), clamp255(((c >>> 8) & 255) * m),
                 clamp255(((c >>> 16) & 255) * m), c >>> 24);
  }
  return out;
}
/* a tight specular streak, for varnish, steel and glass */
function specular(t, height, cx, cy, tight, power) {
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const i = y * TS + x, c = t[i];
    if ((c >>> 24) === 0) continue;
    const dx = (x - cx) / TS, dy = (y - cy) / TS;
    let s = 1 - Math.sqrt(dx * dx + dy * dy) * tight;
    if (s <= 0) continue;
    s = Math.pow(s, 3) * power * (0.6 + height[i] * 0.8);
    t[i] = col(clamp255((c & 255) + 255 * s), clamp255(((c >>> 8) & 255) + 255 * s),
               clamp255(((c >>> 16) & 255) + 255 * s), c >>> 24);
  }
}
/* darken the very edge of a tile so adjoining surfaces read as separate
   objects -- baked ambient occlusion */
function edgeAO(t, depth, amount) {
  modulate(t, (x, y) => {
    const d = Math.min(Math.min(x, TS - 1 - x), Math.min(y, TS - 1 - y));
    if (d >= depth) return 1;
    return 1 - (1 - d / depth) * amount;
  });
}

/* --------------------------------------------------------- REAL MATERIALS */
/* Varnished timber: end-to-end grain, growth rings, knots, worn sheen. */
function wood(r, g, b, plankH, seed, vertical) {
  const t = nt(), hgt = new Float32Array(TA);
  srand(seed);
  const planks = Math.max(1, Math.round(TS / plankH));
  const tone = [];
  for (let k = 0; k < planks; k++) tone.push(0.82 + rnd() * 0.36);
  for (let y = 0; y < TS; y++) {
    const k = Math.min(planks - 1, (y / plankH) | 0);
    const inPlank = y - k * plankH;
    for (let x = 0; x < TS; x++) {
      /* grain: stretched noise plus ring bands */
      const gx = x * 0.055, gy = y * 0.9;
      const n = fbm(gx, gy * 0.06 + k * 7, 4, 1.0, 0);
      const rings = Math.abs(Math.sin((n * 5.2 + x * 0.012) * Math.PI * 2.2));
      let v = tone[k] * (0.86 + rings * 0.26 + n * 0.12);
      /* the seam between planks, with a soft shadow above it */
      if (inPlank < 1.2) v *= 0.34;
      else if (inPlank < 3) v *= 0.62 + (inPlank - 1.2) * 0.2;
      else if (inPlank > plankH - 2) v *= 0.74;
      const c = col(clamp255(r * v), clamp255(g * v), clamp255(b * v));
      t[y * TS + x] = c;
      hgt[y * TS + x] = inPlank < 1.2 ? 0.05 : 0.45 + rings * 0.4 + n * 0.15;
    }
  }
  /* knots */
  const knots = 1 + ((rnd() * 3) | 0);
  for (let q = 0; q < knots; q++) {
    const kx = rnd() * TS, ky = rnd() * TS, kr = 5 + rnd() * 7;
    for (let y = (ky - kr * 2) | 0; y < ky + kr * 2; y++) {
      for (let x = (kx - kr * 2) | 0; x < kx + kr * 2; x++) {
        const dx = (x - kx) / kr, dy = (y - ky) / (kr * 0.62);
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > 2) continue;
        const i = ((y & TM) * TS) + (x & TM);
        const band = 0.55 + 0.45 * Math.sin(d * 7);
        const f = d < 1 ? 0.38 + band * 0.22 : 1 - (2 - d) * 0.18;
        const c = t[i];
        t[i] = shade(c, f);
        hgt[i] *= d < 1 ? 0.5 : 1;
      }
    }
  }
  /* wear: scuffs and a couple of scratches */
  for (let q = 0; q < 5; q++) {
    let x = rnd() * TS, y = rnd() * TS, a = rnd() * 6.28;
    for (let i = 0; i < 60; i++) {
      const idx = ((y | 0) & TM) * TS + ((x | 0) & TM);
      t[idx] = shade(t[idx], 1.16); hgt[idx] += 0.1;
      a += (rnd() - 0.5) * 0.5; x += Math.cos(a) * 1.6; y += Math.sin(a) * 1.6;
    }
  }
  let out = reliefLight(t, hgt, 1.5);
  specular(out, hgt, 40, 34, 1.5, 0.16);
  if (vertical) {
    const o = nt();
    for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) o[x * TS + (TS - 1 - y)] = out[y * TS + x];
    out = o;
  }
  edgeAO(out, 5, 0.30);
  return out;
}
/* Glazed ceramic tile: grout channels, gloss, and a little grime. */
function tile(r, g, b, s, seed) {
  const t = nt(), hgt = new Float32Array(TA);
  srand(seed);
  const grout = col(clamp255(r * 0.52), clamp255(g * 0.52), clamp255(b * 0.50));
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const ix = x % s, iy = y % s;
    const edge = ix < 3 || iy < 3;
    const i = y * TS + x;
    if (edge) {
      const dirt = fbm(x * 0.3, y * 0.3, 3, 1, 1);
      t[i] = shade(grout, 0.8 + dirt * 0.5);
      hgt[i] = 0.05;
    } else {
      const cell = (((x / s) | 0) * 13 + ((y / s) | 0) * 7) % 11;
      const v = 0.95 + cell * 0.008 + fbm(x * 0.06, y * 0.06, 2, 1, 2) * 0.10;
      t[i] = col(clamp255(r * v), clamp255(g * v), clamp255(b * v));
      hgt[i] = 0.8 - (Math.min(ix, iy, s - 1 - ix, s - 1 - iy) < 5 ? 0.25 : 0);
    }
  }
  const out = reliefLight(t, hgt, 2.0);
  specular(out, hgt, 34, 28, 1.35, 0.30);
  specular(out, hgt, 96, 92, 1.8, 0.14);
  edgeAO(out, 4, 0.22);
  return out;
}
/* Poured concrete: aggregate, pitting, water stains. */
function concrete(r, g, b, seed) {
  const t = nt(), hgt = new Float32Array(TA);
  srand(seed);
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const n = fbm(x * 0.09, y * 0.09, 4, 1, 0);
    const fine = fbm(x * 0.5, y * 0.5, 2, 1, 3);
    const stain = fbm(x * 0.02, y * 0.02, 3, 1, 1);
    const v = 0.74 + n * 0.28 + fine * 0.14 - stain * 0.18;
    t[y * TS + x] = col(clamp255(r * v), clamp255(g * v), clamp255(b * v));
    hgt[y * TS + x] = n * 0.7 + fine * 0.3;
  }
  for (let q = 0; q < 260; q++) {                       // exposed aggregate
    const x = rnd() * TS, y = rnd() * TS, s = 0.8 + rnd() * 2.4;
    const c = shade(col(r, g, b), 0.78 + rnd() * 0.5);
    CIR(t, x, y, s, c);
    for (let j = -s; j <= s; j++) for (let i = -s; i <= s; i++)
      hgt[(((y + j) | 0) & TM) * TS + (((x + i) | 0) & TM)] += 0.35;
  }
  for (let q = 0; q < 4; q++) {                         // hairline cracks
    let x = rnd() * TS, y = rnd() * TS, a = rnd() * 6.28;
    for (let i = 0; i < 90; i++) {
      const idx = ((y | 0) & TM) * TS + ((x | 0) & TM);
      t[idx] = shade(t[idx], 0.52); hgt[idx] = 0;
      a += (rnd() - 0.5) * 0.6; x += Math.cos(a) * 1.4; y += Math.sin(a) * 1.4;
    }
  }
  const out = reliefLight(t, hgt, 1.1);

  R(t, 0, 0, TS, SIGN_H, col(14, 18, 16));                     // the housing

    if (gx > TS || gx + gw < 0) continue;

}

/* ========================================================== CHARACTER ART
   Soft-shaded, lit from the upper left, with material detail rather than
   linework. No outlines anywhere. */
const INK = col(26, 20, 30);
const LX = -0.55, LY = -0.72;                 // light direction

/* a shaded volume: sphere-ish falloff, rim light, optional surface bumps */
function blob(t, cx, cy, rx, ry, base, seed, bump, rim) {
  for (let y = (cy - ry) | 0; y <= cy + ry; y++) {
    for (let x = (cx - rx) | 0; x <= cx + rx; x++) {
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      const d2 = dx * dx + dy * dy;
      if (d2 > 1) continue;
      const z = Math.sqrt(1 - d2);
      let l = 0.42 + Math.max(0, -(dx * LX + dy * LY) * 0.55 + z * 0.55);
      if (bump) l *= 0.86 + fbm((x + seed) * 0.16, (y + seed) * 0.16, 3, 1, seed & 3) * 0.32;
      if (rim) { const r = Math.pow(1 - z, 3) * 0.5; l += r; }
      P(t, x, y, shade(base, Math.min(1.35, l)));
    }
  }
}
function boxShade(t, x0, y0, w, h, base, seed, rough) {
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
    const fx = (x - x0) / w, fy = (y - y0) / h;
    let l = 0.72 + (1 - fy) * 0.28 + (1 - fx) * 0.12;
    if (rough) l *= 0.9 + fbm((x + seed) * 0.22, (y + seed) * 0.22, 3, 1, (seed + 1) & 3) * 0.22;
    P(t, x, y, shade(base, Math.min(1.28, l)));
  }
}
/* a believable eye: shaded sclera, ringed iris, pupil, catchlight */
function eye(t, cx, cy, r, iris, lookx, looky, lidTop) {
  for (let y = (cy - r) | 0; y <= cy + r; y++) for (let x = (cx - r) | 0; x <= cx + r; x++) {
    const dx = (x - cx) / r, dy = (y - cy) / r;
    const d2 = dx * dx + dy * dy;
    if (d2 > 1) continue;
    const sh = 0.72 + (1 - dy) * 0.2 - Math.max(0, dy) * 0.22;
    P(t, x, y, shade(col(246, 246, 244), Math.min(1.15, sh)));
  }
  const ir = r * 0.52, ix = cx + (lookx || 0) * r * 0.22, iy = cy + (looky || 0) * r * 0.22;
  for (let y = (iy - ir) | 0; y <= iy + ir; y++) for (let x = (ix - ir) | 0; x <= ix + ir; x++) {
    const dx = (x - ix) / ir, dy = (y - iy) / ir, d = Math.sqrt(dx * dx + dy * dy);
    if (d > 1) continue;
    const ring = 0.72 + 0.34 * Math.sin(d * 13 + Math.atan2(dy, dx) * 3);
    const dark = 1 - Math.pow(d, 2) * 0.45;
    P(t, x, y, shade(iris, ring * dark));
  }
  CIR(t, ix, iy, ir * 0.46, col(16, 14, 20));
  CIR(t, ix - ir * 0.34, iy - ir * 0.38, ir * 0.26, col(255, 255, 255));
  CIR(t, ix + ir * 0.3, iy + ir * 0.34, ir * 0.12, col(210, 225, 255, 170));
  /* lid shadow across the top of the ball */
  for (let y = (cy - r) | 0; y < cy - r * (lidTop === undefined ? 0.42 : lidTop); y++)
    for (let x = (cx - r) | 0; x <= cx + r; x++) {
      const dx = (x - cx) / r, dy = (y - cy) / r;
      if (dx * dx + dy * dy > 1) continue;
      const i = ((y | 0) * TS) + (x | 0);
      if (x < 0 || y < 0 || x >= TS || y >= TS) continue;
      t[i] = shade(t[i], 0.72);
    }
}
function lashes(t, cx, cy, r, n, up) {

function drawChar(t, S) {
  const bc = S.bc;
  const shirt = S.shirt || shade(bc, 0.72);

  let hx = 64, hy = 46, hr = 26;

  if (body === "tall") {
    blob(t, 64, 66, 22, 46, bc, S.seed, false, true);

    blob(t, 64, 66, 9, 22, shade(bc, 0.9), S.seed + 2, false, true);
    for (const s of [-1, 1]) { LINE(t, 64 + s * 8, 96, 64 + s * 16, 124, shade(bc, 0.8), 9); LINE(t, 64 + s * 3, 98, 64 + s * 6, 126, shade(bc, 0.8), 9); }

    const pts = [[64, 10], [84, 60], [118, 66], [90, 96], [100, 120], [64, 98], [28, 120], [38, 96], [10, 66], [44, 60]];
    for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {

      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;
      }
      if (!ins) continue;
      const n = fbm(x * 0.2, y * 0.2, 3, 1, 3);
      const l = 0.68 + Math.max(0, 1 - Math.hypot((x - 54) / 70, (y - 44) / 70)) * 0.5 + n * 0.14;

    blob(t, 64, 66, 32, 30, bc, S.seed, true, true);
    for (const s of [-1, 1]) {

  } else if (body === "squirrel") {

    for (let s = 0; s < 60; s++) {
      const a = s * 0.36, r = 28 - s * 0.44;

  } else if (body === "tiny") {

    blob(t, 64, 48, 22, 21, shade(bc, 1.06), S.seed + 1, true, true);
    blob(t, 94, 80, 15, 19, shade(bc, 0.82), S.seed + 2, false, true);

/* --------------------------------------------------------------- LIGHTING
   Textures are stored unlit, once. Light is applied per pixel while
   rasterising, so shading is continuous rather than stepped and the
   memory cost of a 128px material set stays small. */
const FOG = [9, 11, 13];
/* Granny's house is filthy: every surface gets water stains, drips and a
   layer of ground-in dirt before it is ever lit. */
function grime(t, seed, amount) {
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const i = y * TS + x, c = t[i];
    const al = c >>> 24;
    if (al === 0 || al === 254) continue;                 // leave lit signage alone
    const blot = fbm(x * 0.028, y * 0.028, 4, 1, seed & 3);
    const fine = fbm(x * 0.11, y * 0.11, 3, 1, (seed + 1) & 3);
    const drip = fbm(x * 0.42, y * 0.012, 2, 1, (seed + 2) & 3);
    let m = 1 - amount * Math.max(0, blot - 0.44) * 1.9
              - amount * 0.45 * Math.max(0, fine - 0.58);
    if (drip > 0.60) m *= 1 - amount * 0.30 * (drip - 0.60) * 4;
    if (m < 0.24) m = 0.24;
    let r = (c & 255) * m, g = ((c >>> 8) & 255) * m, bl = ((c >>> 16) & 255) * m;
    const lum = r * 0.3 + g * 0.59 + bl * 0.11;         // wash the colour out
    r += (lum - r) * 0.24; g += (lum - g) * 0.24; bl += (lum - bl) * 0.24;
    t[i] = col(clamp255(r), clamp255(g), clamp255(bl), c >>> 24);
  }
  return t;
}
const TEX = {};
let _regSeed = 0;
function reg(name, tex) { TEX[name] = grime(tex, _regSeed++ * 7 + 3, 0.62); }

/* raw texture -> canvas so it can be blown up with drawImage */
function texToCanvas(tex) {
  const c = document.createElement("canvas"); c.width = TS; c.height = TS;
  const cx = c.getContext("2d");
  const id = cx.createImageData(TS, TS);
  new Uint32Array(id.data.buffer).set(tex);
  cx.putImageData(id, 0, 0);
  return c;
}

let actx = null, master = null, muted = false;
let humOsc = null, humGain = null, humPan = null;
let chaseOsc = null, chaseGain = null, chaseTimer = 0;
function initAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = actx.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(actx.destination);
  /* the low room tone that swells when he is near */
  humOsc = actx.createOscillator(); humOsc.type = "sawtooth"; humOsc.frequency.value = 58;
  humGain = actx.createGain(); humGain.gain.value = 0;
  humPan = actx.createStereoPanner ? actx.createStereoPanner() : null;
  const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 300;
  humOsc.connect(lp); lp.connect(humGain);
  if (humPan) { humGain.connect(humPan); humPan.connect(master); } else humGain.connect(master);
  humOsc.start();
}
function blip(freq, dur, type, vol, pan, sweepTo) {
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(freq, actx.currentTime);
  if (sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, sweepTo), actx.currentTime + dur);
  g.gain.setValueAtTime(vol === undefined ? 0.14 : vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, actx.currentTime + dur);
  o.connect(g);
  let node = g;
  if (pan !== undefined && actx.createStereoPanner) {
    const p = actx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan));
    g.connect(p); node = p;
  }
  node.connect(master); o.start(); o.stop(actx.currentTime + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, pan, freq, q) {
  if (!actx || muted) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 1.2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = "bandpass";
  f.frequency.value = freq || 1000; f.Q.value = q || 1;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol === undefined ? 0.12 : vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, actx.currentTime + dur);
  s.connect(f); f.connect(g);
  let node = g;
  if (pan !== undefined && actx.createStereoPanner) {
    const p = actx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan));
    g.connect(p); node = p;
  }
  node.connect(master); s.start(); s.stop(actx.currentTime + dur + 0.02);
}
/* SpongeBob's idle whistle -- cheerful, which is the unsettling part */
function whistle(pan) {
  if (!actx || muted) return;
  const notes = [784, 880, 988, 880, 784, 659];
  notes.forEach((f, i) => setTimeout(() => blip(f, 0.16, "sine", 0.07, pan), i * 150));
}
function readyLine(pan) {
  if (!actx || muted) return;
  [520, 470, 640].forEach((f, i) => setTimeout(() => blip(f, 0.1, "square", 0.055, pan, f * 1.3), i * 110));
}
/* cheerful burbling normally; when he's spotted SpongeBob it goes high, fast
   and clipped, so you hear the warning as well as see it on his face */
function patrickLine(pan, scared) {
  if (!actx || muted) return;
  if (scared) {
    for (let i = 0; i < 5; i++)
      setTimeout(() => blip(520 + Math.random() * 260, 0.06, "square", 0.055, pan), i * 70);
    return;
  }
  const n = 3 + ((Math.random() * 3) | 0);
  for (let i = 0; i < n; i++) setTimeout(() => blip(180 + Math.random() * 90, 0.11, "sawtooth", 0.05, pan), i * 130);
}

const SAVE_KEY = "krustyKrabEscape.v1";
let storageOK = true;
let SAVE = { bucks: 0, owned: ["frycook"], equipped: "frycook", escapes: 0, best: 0 };
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s === "object") {
        SAVE.bucks = Math.max(0, s.bucks | 0);
        SAVE.owned = Array.isArray(s.owned) && s.owned.length ? s.owned.filter(id => SKINS.some(k => k.id === id)) : ["frycook"];
        if (!SAVE.owned.includes("frycook")) SAVE.owned.push("frycook");
        SAVE.equipped = SAVE.owned.includes(s.equipped) ? s.equipped : "frycook";
        SAVE.escapes = Math.max(0, s.escapes | 0);
        SAVE.best = Math.max(0, +s.best || 0);
      }
    }
    /* prove we can actually write, not just read */
    localStorage.setItem(SAVE_KEY + ".probe", "1");
    localStorage.removeItem(SAVE_KEY + ".probe");
  } catch (e) { storageOK = false; }
}
function writeSave() {
  if (!storageOK) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { storageOK = false; }
}
loadSave();

const hasKey = id => !!G.keys[id] && !G.used[id];
const keyCount = () => KEYDEF.reduce((n, k) => n + (G.keys[k.id] && !G.used[k.id] ? 1 : 0), 0);

/* Colour doors, boards, pits and props are all solid until you deal with
   them. Opening a door rewrites the tile to floor, so you can never be
   sealed in a room by spending a key. */
function solidAt(x, y) {
  const c = ch(x, y);
  return c === C_WALL || c === C_r || c === C_b || c === C_g || c === C_y ||
         c === C_PIT || c === C_BOARD || c === C_NOTE || c === C_SAFE ||
         c === C_CHAIN || c === C_EXIT || c === C_HIDE;
}
/* SpongeBob works here. Locked doors and boarded frames do not stop him;
   a hole in the floor does. */
function solidForSponge(x, y) {
  const c = ch(x, y);
  return c === C_WALL || c === C_PIT || c === C_NOTE || c === C_SAFE ||
         c === C_CHAIN || c === C_EXIT || c === C_HIDE;
}
function wallTexFor(c, x, y) {
  switch (c) {
    case C_r: return TEX.doorR;  case C_b: return TEX.doorB;
    case C_g: return TEX.doorG;  case C_y: return TEX.doorY;
    case C_BOARD: return TEX_BOARD;
    case C_EXIT:  return x === 6 ? TEX_FRONT_L : TEX_FRONT_R;
    case C_SAFE:  return TEX_SAFE;
    case C_CHAIN: return TEX_CHAIN;
    case C_NOTE:  return TEX.note;
    case C_HIDE:  return TEX.hide;
  }
  switch (zoneAt(x, y)) {
    case Z_DINING:   return ((x * 7 + y * 3) % 3 === 0) ? TEX.wDiningB : TEX.wDining;
    case Z_OFFICE:   return TEX.wOffice;
    case Z_KITCHEN:  return TEX.wKitchen;
    case Z_BASEMENT: return TEX.wBasement;
    case Z_FREEZER:  return TEX.wFreezer;
    case Z_DOCK:     return TEX.wDock;
    default:         return TEX.wShaft;
  }
}
function floorTexFor(c, x, y) {
  if (c === C_GREASE) return TEX.grease;
  if (c === C_PIT) return TEX.pit;
  if (c === C_PLANK) return TEX.planked;
  switch (zoneAt(x, y)) {
    case Z_DINING: case Z_OFFICE: return TEX.fWood;
    case Z_KITCHEN:  return TEX.fTile;
    case Z_BASEMENT: return TEX.fConc;
    case Z_FREEZER:  return TEX.fCold;
    case Z_DOCK:     return TEX.fDock;
    default:         return TEX.fWood;
  }
}
function losClear(x0, y0, x1, y1, forSponge) {
  const dx = x1 - x0, dy = y1 - y0;
  const dist = Math.hypot(dx, dy); if (dist < 0.001) return true;
  const steps = Math.ceil(dist / 0.12), sx = dx / steps, sy = dy / steps;
  let x = x0, y = y0;
  for (let i = 0; i < steps; i++) {
    x += sx; y += sy;
    if (forSponge ? solidForSponge(x | 0, y | 0) : solidAt(x | 0, y | 0)) return false;
  }
  return true;
}
function toast(text, life) {
  G.toasts.push({ text, t: life === undefined ? 2.6 : life });
  if (G.toasts.length > 4) G.toasts.shift();
}

/* --------------------------------------------------------------- BFS PATH */
const bfsPrev = new Int32Array(MAPW * MAPH);
const bfsQ = new Int32Array(MAPW * MAPH);
const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function nextStep(sx, sy, tx, ty, forSponge) {
  const solid = forSponge ? solidForSponge : solidAt;
  if (sx === tx && sy === ty) return null;
  bfsPrev.fill(-1);
  let head = 0, tail = 0;
  const s = sy * MAPW + sx, t = ty * MAPW + tx;
  bfsQ[tail++] = s; bfsPrev[s] = s;
  let found = false;
  while (head < tail) {
    const cur = bfsQ[head++];
    if (cur === t) { found = true; break; }
    const cx = cur % MAPW, cy = (cur / MAPW) | 0;
    for (let i = 0; i < 4; i++) {
      const nx = cx + D4[i][0], ny = cy + D4[i][1];
      if (nx < 0 || ny < 0 || nx >= MAPW || ny >= MAPH) continue;
      const ni = ny * MAPW + nx;
      if (bfsPrev[ni] !== -1 || solid(nx, ny)) continue;
      bfsPrev[ni] = cur; bfsQ[tail++] = ni;
    }
  }
  if (!found) return null;
  let n = t;
  while (bfsPrev[n] !== s && bfsPrev[n] !== n) n = bfsPrev[n];
  return [n % MAPW, (n / MAPW) | 0];
}

/* -------------------------------------------------------------- INTERACT */
function facingTile(reach) {
  const dx = Math.cos(G.ang), dy = Math.sin(G.ang);
  for (let d = 0.28; d <= (reach || 1.5); d += 0.14) {
    const tx = (G.px + dx * d) | 0, ty = (G.py + dy * d) | 0;
    const c = ch(tx, ty);
    if (c !== C_DOT && c !== C_GREASE && c !== C_STEAM && c !== C_PLANK) return { tx, ty, c };
  }
  return null;
}
function makeNoise(radius) {
  const S = G.sponge;
  if (S.stun > 0) return;
  const r = radius + (G.patrick.active ? TUNING.patrickNoise : 0);
  if (Math.hypot(S.x - G.px, S.y - G.py) <= r) {
    S.lastX = G.px; S.lastY = G.py;
    if (S.mode !== "CHASE") { S.mode = "HUNT"; S.lostT = 0; S.repathT = 0; }
  }
}
function panFor(x, y) {
  const dx = x - G.px, dy = y - G.py;
  let a = Math.atan2(dy, dx) - G.ang;
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return Math.max(-1, Math.min(1, Math.sin(a)));
}

function interact() {
  if (G.dial) { commitDial(); return; }
  if (G.act) return;                                    // already committed to something
  if (G.hidden) { G.hidden = false; toast("You slip back out."); blip(180, 0.09, "square", 0.1); return; }

  let best = null, bd = 1.15;
  for (const s of G.sprites) {
    if (s.taken) continue;
    const d = Math.hypot(s.x - G.px, s.y - G.py);
    if (d < bd) { bd = d; best = s; }
  }
  if (best) { pickUp(best); return; }

  /* a plank already laid down can be pried back up */
  if (G.plankAt) {
    const [px, py] = G.plankAt;
    if (Math.hypot(px + 0.5 - G.px, py + 0.5 - G.py) < 1.6) {
      G.act = { kind: "pry", t: 0, dur: TUNING.plankTime * 0.7, tx: px, ty: py };
      return;
    }
  }
  const f = facingTile();
  if (!f) { fire(); return; }
  switch (f.c) {
    case C_HIDE:
      G.hidden = true; G.hideTile = [f.tx, f.ty];
      toast("You squeeze in and hold your breath.", 2.6);
      blip(140, 0.12, "square", 0.1); return;
    case C_NOTE:  readNote(f); return;
    case C_SAFE:  openDial(); return;
    case C_CHAIN: startChains(); return;
    case C_PIT:   tryPlank(f); return;
    case C_BOARD: swingAt(f, false); return;
    case C_EXIT:  frontDoor(f); return;
    case C_r: case C_b: case C_g: case C_y: tryUnlock(f); return;
  }
  fire();
}

function pickUp(s) {
  if (s.kind === "gun") {
    s.taken = true; G.hasGun = true; G.tool = "gun";
    toast("BUBBLE GUN. It's empty — find bubble bottles.", 4.5);
    blip(300, 0.08, "square", 0.16); blip(680, 0.12, "sine", 0.14); return;
  }
  if (s.kind === "bottle") {
    if (G.ammo >= TUNING.maxAmmo) { toast("You can't carry more than " + TUNING.maxAmmo + " bottles."); return; }
    s.taken = true; G.ammo++;
    toast("BUBBLE BOTTLE  [" + G.ammo + "/" + TUNING.maxAmmo + "]", 2);
    blip(560, 0.07, "sine", 0.15); blip(920, 0.09, "sine", 0.11); return;
  }
  if (s.kind === "hammer") {
    s.taken = true; G.hasHammer = true; G.tool = "hammer";
    toast("HAMMER. Boarded-up doorways don't stand a chance.", 4.5);
    toast("It is LOUD. He will come running.", 4);
    blip(220, 0.12, "square", 0.18); noise(0.15, 0.12, 0, 900, 1); return;
  }
  if (s.kind === "plank") {
    s.taken = true; G.hasPlank = true; G.tool = "plank";
    toast("PLANK. Lay it over a grease pit to cross.", 4.5);
    blip(300, 0.1, "square", 0.14); return;
  }
  if (s.kind === "key") {
    s.taken = true; G.keys[s.id] = true;
    const k = KEYDEF[KI(s.id)];
    G.held = s.id;
    if (s.id === "white") {
      toast("THE WHITE KEY. It isn't for a door.", 5);
      toast("Patrick is chained up in the dining room. Press 5 to hold it.", 5.5);
    } else {
      toast(k.name + " — in your hand. Press " + (KI(s.id) + 1) + " to stow it.", 4.5);
      toast("Hold it up to the " + k.name.split(" ")[0] + " DOOR and press E.", 4.5);
    }
    blip(680, 0.09, "square", 0.18); blip(1010, 0.13, "square", 0.15);
  }
}

/* --- colour doors: the key is spent, the padlock breaks off ------------- */
function tryUnlock(f) {
  const k = KEYDEF.find(k => k.door === f.c);
  if (!G.keys[k.id] || G.used[k.id]) {
    toast("Locked tight. You need the " + k.name + ".", 3);
    blip(110, 0.18, "square", 0.14); return;
  }
  if (G.held !== k.id) {
    toast("Take the " + k.name + " in hand first — press " + (KI(k.id) + 1) + ".", 3.4);
    blip(150, 0.14, "square", 0.12); return;
  }
  G.act = { kind: "unlock", t: 0, dur: 0.75, tx: f.tx, ty: f.ty, key: k.id };
  blip(300, 0.1, "square", 0.14);
}
function finishUnlock(a) {
  const k = KEYDEF[KI(a.key)];
  setCh(a.tx, a.ty, C_DOT);
  /* the twin tile of the doorway swings with it */
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]])
    if (ch(a.tx + dx, a.ty + dy) === k.door) setCh(a.tx + dx, a.ty + dy, C_DOT);
  G.used[k.id] = true; G.held = null;
  spark(a.tx + 0.5, a.ty + 0.5, true);
  toast(k.name.split(" ")[0] + " DOOR OPEN — the padlock drops off. Key's spent.", 3.6);
  blip(210, 0.2, "square", 0.2); blip(140, 0.34, "sawtooth", 0.15, 0, 62);
  noise(0.34, 0.15, 0, 420, 0.9);
  G.shake = Math.max(G.shake, 4);
  makeNoise(10);
}

/* --- hammer ------------------------------------------------------------ */
function swingAt(f, isFront) {
  if (!G.hasHammer) {
    toast(isFront ? "Boarded shut. You'd need something to break them with."
                  : "Boarded up. You need a hammer.", 3.2);
    blip(120, 0.14, "square", 0.12); return;
  }
  if (isFront && !G.unbolted) {
    toast("THE DOORS ARE BOLTED — the boards won't budge.", 3.4);
    blip(100, 0.2, "square", 0.14); return;
  }
  G.tool = "hammer";
  G.act = { kind: "swing", t: 0, dur: TUNING.swingTime, tx: f.tx, ty: f.ty, front: isFront };
}
function finishSwing(a) {
  G.swing = 0.3; G.shake = Math.max(G.shake, 7);
  spark(a.tx + 0.5, a.ty + 0.5, false);
  blip(190, 0.16, "square", 0.22, 0, 90);
  noise(0.28, 0.24, 0, 700, 0.7);
  makeNoise(TUNING.noiseHammer);
  if (a.front) {
    G.smashFront++; refreshFront();
    if (G.smashFront >= TUNING.smashFront) {
      toast("THE LAST BOARD COMES OFF. Get Patrick and GO.", 4.5);
      blip(520, 0.2, "square", 0.2); blip(700, 0.28, "square", 0.18);
    } else toast("BOARD OFF — " + (TUNING.smashFront - G.smashFront) + " to go. He heard that.", 2.4);
  } else {
    G.smashBoard++; refreshBoard();
    if (G.smashBoard >= TUNING.smashKitchen) {
      setCh(a.tx, a.ty, C_DOT);
      for (const [dx, dy] of [[1, 0], [-1, 0]])
        if (ch(a.tx + dx, a.ty + dy) === C_BOARD) setCh(a.tx + dx, a.ty + dy, C_DOT);
      toast("The doorway is clear.", 3);
      blip(420, 0.18, "square", 0.18);
    } else toast("CRACK — " + (TUNING.smashKitchen - G.smashBoard) + " more swings.", 2.2);
  }
}

/* --- plank ------------------------------------------------------------- */
function tryPlank(f) {
  if (!G.hasPlank) {
    if (G.plankAt) toast("Your plank is nailed down somewhere else — go pry it up.", 3.4);
    else toast("A GREASE PIT. You'd need a plank to get across.", 3.4);
    blip(120, 0.14, "square", 0.12); return;
  }
  if (!G.hasHammer) {
    toast("Nothing to nail it down with. Find a hammer.", 3.2);
    blip(120, 0.14, "square", 0.12); return;
  }

  G.act = { kind: "plank", t: 0, dur: TUNING.plankTime, tx: f.tx, ty: f.ty };
}
function finishPlank(a) {
  setCh(a.tx, a.ty, C_PLANK);
  G.hasPlank = false; G.plankAt = [a.tx, a.ty];
  toast("Plank down. Mind your footing.", 2.6);

}
function finishPry(a) {
